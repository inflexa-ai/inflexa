id: R-0165
title: "Reactome and WikiPathways from the reference store are the further collections after Hallmark, each with its release stated"
assertion: >-
  After the MSigDB Hallmark collection, take the Reactome pathways GMT and
  the WikiPathways collection from the reference store as the further
  collections for human or mouse. WikiPathways holds a human, a mouse, and
  a rat collection, thus a mouse list uses the mouse collection without an
  ortholog map. Both collections change with each release, thus state the
  release of each collection beside its name in the report, and do not
  merge the collections into one set list, because a pathway in two
  collections is one finding tested twice. Apply the same size window and
  the same universe to each collection.
modality: bulk_rna_seq
conditions:
  - field: data_state
    op: in
    value: [counts, tpm_or_fpkm, log_normalized]
  - field: organism
    op: in
    value: [human, mouse]
  - field: question
    op: in
    value: [enrichment, full_plan]
action:
  step_type: enrichment
  parameters:
    - name: further_collections
      value: [reactome_gmt, wikipathways]
      default_source: "doi:10.1093/nar/gkz1031"
    - name: collection_release_statement
      value: release_per_collection
      default_source: "rule:R-0165"
severity: info
strength: common_practice
evidence_quality: moderate
recommendation_strength: conditional
evidence:
  - direction: supports
    eco: ECO:0000033
    cito: cito:supports
    source: S-0070
    paraphrase: >-
      Reactome is a curated knowledgebase of human pathways in one
      consistent data model, and it serves both as an archive of biological
      processes and as a tool for the analysis of data such as gene
      expression profiles. The content grows with new annotation.
    anchor: "Abstract; Data content and releases; Analysis tools"
    retrieved: "2026-09-06"
  - direction: neutral
    eco: ECO:0000033
    cito: cito:discusses
    source: S-0125
    paraphrase: >-
      WikiPathways is an open-source, community-curated pathway database,
      and the paper describes its restructured infrastructure, its content
      growth, and its data releases. The paper does not itself state the
      species list or the GMT format of the store collection.
    anchor: "Abstract; Data access and downloads"
    retrieved: "2026-09-06"
status: active
