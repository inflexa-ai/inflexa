name: "Release: harness"

# Releases @inflexa-ai/harness on its own, with no pull request. Pick a bump,
# and release-bump.yml pushes the bump to main as the release bot and blocks
# until release-harness.yml has the version on npm.
#
# This does not move cli's @inflexa-ai/harness pin. A cli that ships the harness
# released here is a two-component release, which is what "Release: all" does.
on:
  workflow_dispatch:
    inputs:
      harness_bump:
        description: "harness bump, from the version field of harness/package.json on main. None does nothing."
        required: false
        default: none
        type: choice
        options: [none, patch, minor, major]

permissions: {}

# One release at a time across all four dispatchable workflows. Two runs pushing
# bumps to main at once would cancel each other's checks on main, and the
# release gates that wait on those checks would then fail.
concurrency:
  group: release-bump
  cancel-in-progress: false

jobs:
  harness:
    uses: ./.github/workflows/release-bump.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      component: harness
      bump: ${{ inputs.harness_bump }}
