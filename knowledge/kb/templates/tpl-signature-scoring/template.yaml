id: tpl-signature-scoring
version: 1.0.0
label: "Per-sample signature scores with UCell, singscore, or GSVA on log-CPM, with limma on the score matrix"
language: R
method: M-0045
step_types: [signature_scoring]
edam_operations: [EDAM:operation_3501]
citations: [S-0112, S-0113, S-0047, S-0007, S-0004, S-0041, S-0031, S-0019]
license: Apache-2.0
applicability:
  modality: bulk_rna_seq
  count_sources: [salmon, kallisto, star_featurecounts, rsem, unknown]
  design_patterns: [two_group_unpaired, two_group_with_balanced_batch, two_group_with_covariates, two_group_paired, two_group_with_blocking_factor]
  min_replicates: 2
  conditions:
    - field: data_state
      op: eq
      value: counts
    - field: interaction
      op: is_null
    - field: n_timepoints
      op: is_null
  notes: >-
    A count matrix whose first column is the gene identifier and whose header
    holds the sample identifiers, plus a sample table with one row per sample,
    plus a signature collection in GMT format whose gene identifiers match the
    gene column. The script filters the genes with filterByExpr, scales the
    library sizes, and computes log-CPM. Then one rank-based method gives each
    signature one score per sample: UCell from the Mann-Whitney U statistic of
    the signature ranks within the sample, singscore from the mean rank of the
    signature genes within the sample (the GMT set is the up set), or GSVA
    from a kernel estimate of each gene across the samples. A UCell score and
    a singscore of one sample do not depend on the other samples, and a GSVA
    score does. Then limma fits the design to the score matrix and tests one
    contrast: test level against reference level. The condition column is
    renamed to `condition` inside the script, thus the design formula names
    `condition` and any other column of the sample table by its own name. The
    score matrix is a supplement for a heatmap of the signatures across the
    samples or for a later model.
parameters:
  - name: counts_path
    type: string
    description: "Path of the count matrix CSV, first column gene id, header sample ids, integer counts."
    adaptable: true
  - name: metadata_path
    type: string
    description: "Path of the sample table CSV with one row per sample."
    adaptable: true
  - name: sample_id_column
    type: string
    description: "The column of the sample table that holds the sample identifiers that match the count matrix header."
    adaptable: true
    default: sample
  - name: condition_column
    type: string
    description: "The column of the sample table that holds the condition of interest."
    adaptable: true
  - name: reference_level
    type: string
    description: "The level of the condition that is the denominator of the score difference, for example Control."
    adaptable: true
  - name: test_level
    type: string
    description: "The level of the condition that is the numerator of the score difference, for example Treated."
    adaptable: true
  - name: design
    type: formula
    description: "The design formula of the limma model on the scores. It must end with condition. Put a batch, a block, or a covariate before it, for example ~ batch + condition."
    adaptable: true
    default: "~ condition"
    default_source: "doi:10.1093/nar/gkv007"
    pattern: "condition\\s*$"
  - name: gmt_path
    type: string
    description: "Path of the signature collection in GMT format, one signature per line: name, description, then the gene identifiers."
    adaptable: true
  - name: score_method
    type: string
    description: "The per-sample score: ucell (Mann-Whitney U of the signature ranks within the sample), singscore (mean rank of the signature within the sample, signed), or gsva (kernel estimate across the samples, Gaussian kernel on log-CPM)."
    adaptable: true
    default: ucell
    default_source: "doi:10.1016/j.csbj.2021.06.043"
    enum: [ucell, singscore, gsva]
  - name: max_rank
    type: integer
    description: "UCell only: the number of top genes ranked within a sample. A gene below this rank counts as not expressed."
    adaptable: true
    default: 1500
    default_source: "doi:10.1016/j.csbj.2021.06.043"
    minimum: 100
  - name: min_count
    type: integer
    description: "The min.count of filterByExpr: a gene stays when it has at least this many counts, on the CPM scale of the median library, in the smallest group."
    adaptable: true
    default: 10
    default_source: "doi:10.12688/f1000research.9005.3"
    minimum: 0
  - name: min_total_count
    type: integer
    description: "The min.total.count of filterByExpr: a gene also needs at least this many counts over all samples."
    adaptable: true
    default: 15
    default_source: "doi:10.12688/f1000research.9005.3"
    minimum: 0
  - name: normalization_method
    type: string
    description: "The library size scaling method of calcNormFactors, applied before the log-CPM."
    adaptable: true
    default: TMM
    default_source: "doi:10.12688/f1000research.9005.3"
    enum: [TMM, TMMwsp, RLE, upperquartile, none]
  - name: min_size
    type: integer
    description: "A signature enters the score when it has at least this many members among the filtered genes."
    adaptable: true
    default: 10
    default_source: "doi:10.1073/pnas.0506580102"
    minimum: 1
  - name: max_size
    type: integer
    description: "A signature enters the score when it has at most this many members among the filtered genes."
    adaptable: true
    default: 500
    default_source: "doi:10.1073/pnas.0506580102"
    minimum: 1
  - name: padj_cutoff
    type: number
    description: "The adjusted p-value cutoff that marks a signature as significant in the summary and the heatmap."
    adaptable: false
    default: 0.05
    default_source: "doi:10.1111/j.2517-6161.1995.tb02031.x"
  - name: n_top_sets
    type: integer
    description: "The number of signatures on the heatmap, ordered by adjusted p-value."
    adaptable: true
    default: 50
    minimum: 5
  - name: output_prefix
    type: string
    description: "The prefix of the output files, for example signature or hallmark_treated_vs_control."
    adaptable: true
    default: signature
    pattern: "^[A-Za-z0-9_.-]+$"
inputs:
  - name: counts
    path: "{{counts_path}}"
    format: EDAM:format_3752
    description: "Gene by sample raw integer counts, CSV."
  - name: metadata
    path: "{{metadata_path}}"
    format: EDAM:format_3752
    description: "Sample table, CSV."
  - name: gene_sets
    path: "{{gmt_path}}"
    description: "Signature collection, GMT."
outputs:
  - name: scores
    path: "output/{prefix}_scores.csv"
    format: EDAM:format_3752
    description: "The per-sample score matrix: pathway, then one column per sample."
  - name: results
    path: "output/{prefix}_results.csv"
    format: EDAM:format_3752
    description: "One row per scored signature: pathway, log_fold_change_score (the limma coefficient, test minus reference), t, pvalue, padj, size."
  - name: summary
    path: "output/{prefix}_summary.json"
    format: EDAM:format_3464
    description: "The score method, the collection, the contrast, the design, the counts of scored and significant signatures, the thresholds, the package versions."
  - name: score_heatmap
    path: "figures/{prefix}_score_heatmap.png"
    description: "Heatmap of the scores of the top signatures by adjusted p-value, scaled by signature, samples in columns, annotated by condition (and PDF)."
  - name: session
    path: "output/session_info.txt"
    description: "R session information for the record."
environment:
  - name: UCell
    version: "2.16.0"
    track: bioconductor
  - name: singscore
    version: "1.32.0"
    track: bioconductor
  - name: GSVA
    version: "2.6.6"
    track: bioconductor
  - name: edgeR
    version: "4.10.3"
    track: bioconductor
  - name: limma
    version: "3.68.5"
    track: bioconductor
  - name: pheatmap
    version: "1.0.13"
    track: cran
  - name: jsonlite
    version: "2.0.0"
    track: cran
bioconductor: "3.23"
body_file: body.R
tests:
  - name: two-group-n6-hallmark-ucell
    dataset: two_group_n6/seed-1
    slots:
      counts_path: /work/data/counts.csv
      metadata_path: /work/data/metadata.csv
      condition_column: condition
      reference_level: control
      test_level: treated
      gmt_path: /work/refs/hallmark.gmt
    expect:
      - "exists output/signature_scores.csv"
      - "exists output/signature_results.csv"
      - "exists output/signature_summary.json"
      - "exists output/session_info.txt"
      - "exists figures/signature_score_heatmap.png"
      - "exists figures/signature_score_heatmap.pdf"
      - "csv_rows output/signature_results.csv >= 40"
      - "json output/signature_summary.json n_samples == 12"
      - "json output/signature_summary.json score_method == ucell"
      - "truth_set_recall output/signature_results.csv >= 0.66"
  - name: two-group-n6-hallmark-singscore
    dataset: two_group_n6/seed-1
    slots:
      counts_path: /work/data/counts.csv
      metadata_path: /work/data/metadata.csv
      condition_column: condition
      reference_level: control
      test_level: treated
      gmt_path: /work/refs/hallmark.gmt
      score_method: singscore
      output_prefix: singscore
    expect:
      - "exists output/singscore_scores.csv"
      - "exists output/singscore_results.csv"
      - "exists output/singscore_summary.json"
      - "exists figures/singscore_score_heatmap.png"
      - "csv_rows output/singscore_results.csv >= 40"
      - "json output/singscore_summary.json score_method == singscore"
      - "truth_set_recall output/singscore_results.csv >= 0.66"
  - name: two-group-n6-hallmark-gsva
    dataset: two_group_n6/seed-1
    slots:
      counts_path: /work/data/counts.csv
      metadata_path: /work/data/metadata.csv
      condition_column: condition
      reference_level: control
      test_level: treated
      gmt_path: /work/refs/hallmark.gmt
      score_method: gsva
      output_prefix: gsva
    expect:
      - "exists output/gsva_scores.csv"
      - "exists output/gsva_results.csv"
      - "exists output/gsva_summary.json"
      - "exists figures/gsva_score_heatmap.png"
      - "csv_rows output/gsva_results.csv >= 40"
      - "json output/gsva_summary.json score_method == gsva"
      - "truth_set_recall output/gsva_results.csv >= 0.66"
