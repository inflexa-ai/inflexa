id: R-0114
title: "VIPER on an ARACNe regulon is the tool of record for a context-specific regulator activity, and it is absent here"
assertion: >-
  VIPER is the tool of record for a regulator activity from a regulon that
  ARACNe infers from the expression of a cohort of the same tissue, with a
  mode and a likelihood on each edge. VIPER is absent from this environment,
  and so is ARACNe. The substitute is the decoupleR linear model on a prior
  network, CollecTRI or DoRothEA. State the difference in the report: a prior
  network is the same for every tissue, thus a regulator that acts only in
  the tissue of the study can be missed, and a target that is silent there
  adds noise. When a published ARACNe regulon of the tissue is delivered as a
  signed table, the decoupleR model can take it in place of CollecTRI.
modality: bulk_rna_seq
conditions:
  - field: data_state
    op: in
    value: [counts, tpm_or_fpkm, log_normalized]
