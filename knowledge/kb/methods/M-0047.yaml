id: M-0047
label: "WGCNA signed co-expression network with module eigengenes and module membership"
description: >-
  A weighted gene co-expression network on the variance-stabilized or
  log-scale matrix of samples. The signed adjacency is the correlation
  raised to a soft-threshold power, and the power is the lowest one at which
  the network reaches an approximate scale-free fit. The topological overlap
  matrix, hierarchical clustering, and dynamic tree cut give the modules.
  The first principal component of each module is its eigengene, the
  eigengenes are correlated with the sample traits, and the correlation of
  each gene with its module eigengene (module membership) ranks the hub
  genes. For a question about co-expressed gene groups and their relation to
  a trait, on a cohort of enough samples.
packages:
  - name: WGCNA
    track: cran
    version_range: ">=1.70"
  - name: DESeq2
    track: bioconductor
    biotools: deseq2
    version_range: ">=1.50"
    bioconductor: "3.23"
  - name: ggplot2
    track: cran
    version_range: ">=3.5"
  - name: jsonlite
    track: cran
    version_range: ">=1.8"
templates:
  - tpl-wgcna-modules
