name: "Release: all"

# The full release, with no pull request. Pick a bump for each component you
# want to ship, and the run walks them in dependency order: prov-kernel, then
# harness, then cli. Each step bumps the version on main, pushes it as the
# release bot, and blocks until the package is on npm (or, for the cli, until
# the GitHub release is live), so the next step only ever builds against
# something that is really published.
#
# Pick none to leave that component alone. Releasing only the cli is a valid
# run, and so is releasing only the harness — the jobs below skip on none
# rather than failing, and a skipped step never blocks the next. The run summary
# reports the version on main and the target for each component.
#
# If a run fails after a component shipped, use "Re-run failed jobs", or
# dispatch again with none for each component that shipped. "Re-run all jobs"
# bumps and releases every component again.
on:
  workflow_dispatch:
    inputs:
      prov_kernel_bump:
        description: "prov-kernel bump, from the version field of prov-kernel/package.json on main. None skips it."
        required: false
        default: none
        type: choice
        options: [none, patch, minor, major]
      harness_bump:
        description: "harness bump, from the version field of harness/package.json on main. None skips it."
        required: false
        default: none
        type: choice
        options: [none, patch, minor, major]
      cli_bump:
        description: "cli bump, from the version field of cli/package.json on main. None skips it."
        required: false
        default: none
        type: choice
        options: [none, patch, minor, major]

permissions: {}

# One release at a time across all four dispatchable workflows. Two runs pushing
# bumps to main at once would cancel each other's checks on main, and the
# release gates that wait on those checks would then fail.
concurrency:
  group: release-bump
  cancel-in-progress: false

jobs:
  prov-kernel:
    uses: ./.github/workflows/release-bump.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      component: prov-kernel
      bump: ${{ inputs.prov_kernel_bump }}

  harness:
    # The harness does not depend on prov-kernel: harness/package.json names no
    # @inflexa-ai/prov-kernel. This ordering is a serialization, not a
    # dependency. test.yml and lint.yml cancel in-progress runs per ref, so a
    # second bump commit landing on main while the first commit's checks are
    # still running cancels them — and the release workflow that waits on those
    # checks then refuses to ship. One bump on main at a time is what keeps
    # every release gate satisfiable.
    needs: [prov-kernel]
    # An empty version skips a job, and a skipped step must not stop the run.
    if: ${{ !cancelled() && needs.prov-kernel.result != 'failure' }}
    uses: ./.github/workflows/release-bump.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      component: harness
      bump: ${{ inputs.harness_bump }}

  cli:
    # A real dependency this time: cli installs both siblings from npm, and
    # release.yml installs them with a frozen lockfile. Both must be on the
    # registry before the pins below can resolve.
    needs: [prov-kernel, harness]
    if: ${{ !cancelled() && needs.prov-kernel.result != 'failure' && needs.harness.result != 'failure' }}
    uses: ./.github/workflows/release-bump.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      component: cli
      bump: ${{ inputs.cli_bump }}
      # The versions this run just shipped, so the binary bundles them. Each is
      # empty when its component is not part of the run, and an empty pin leaves
      # the existing one in cli/package.json untouched.
      harness_pin: ${{ needs.harness.outputs.version }}
      prov_kernel_pin: ${{ needs.prov-kernel.outputs.version }}
