    ensemblIds: [String!]!,

    "Use the disease ontology to retrieve all its descendants and capture their associated evidence."
    enableIndirect: Boolean,

    "List of datasource ids"
    datasourceIds: [String!],

    "Number of items per page [Default: 25, Max: 3000]"
    size: Int,

    "Opaque cursor for pagination"
    cursor: String): Evidences!

  "Open Targets (OTAR) projects linked to this disease. Data only available in Partner Platform Preview (PPP)"
