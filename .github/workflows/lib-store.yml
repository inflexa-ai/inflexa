name: Build Sandbox Images

# Builds the ONE sandbox runtime image, sandbox-base, from
# images/sandbox-base/Dockerfile + images/lib-store-manifest.yaml and publishes it
# to GitHub Packages (GHCR) as a multi-arch manifest. The image carries the
# language runtimes, the system libraries, the bioconda command-line tools at
# /opt/conda, and the Node packages at /opt/node. It bakes NO R library and NO
# Python library: the package store is the one source of a library, and
# .github/workflows/lib-store-provisioner.yml publishes it.
#
# OPEN DECISION — the per-track tarballs of the managed mount are cut OUT of a
# published image below, and no image carries an R track or a Python track after
# the retirement of the variants. The replacement source is not decided, thus the
# extract step and every step after it fail until it is. See task 7.1 of the change
# `preserve-farm-tracks-and-single-runtime-image`.
#
# Both arches build on large self-hosted Graviton/x86 builders — the conda solve
# and the image assembly do not fit a GitHub-hosted runner. amd64 → label
# `inflexa-builder` (m6i.4xlarge), arm64 → label `inflexa-builder-arm64`
# (m7g.4xlarge); the boxes live in platform-infra (modules/internal/builder-ec2*.tf)
# and are started via `just build-start [arch]`.
#
# The build-time LOAD CHECK runs inside the image build (best-effort + non-empty
# floor). The COVERAGE REPORT runs after extraction (want-vs-got + regression diff
# vs the last published manifest: an amd64 regression fails, an arm64 miss is
# informational). The build advances latest/<arch> at publish (build-floor gated),
# mirroring the image :latest tag. Acceptance (.github/workflows/lib-store-acceptance.yml)
# is a non-gating post-publish validation — it reports, it does not promote.
#
# GHCR push uses the workflow GITHUB_TOKEN (packages: write). S3 publish is OPT-IN
# via repo/org configuration; without it the images still publish but the S3
# upload is skipped:
#   - vars.LIB_STORE_S3_BUCKET        target bucket
#   - vars.LIB_STORE_PUBLISH_ROLE_ARN OIDC role to assume for the upload
#   - vars.AWS_REGION                 optional; defaults to us-east-1

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MANIFEST: images/lib-store-manifest.yaml
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/sandbox-base
  # Single source for the arch list consumed by the manifest combine loop. The
  # build and acceptance job matrices carry per-arch runner+platform, so they
  # list the arches inline — keep all three in lock-step.
  ARCHES: "amd64 arm64"

jobs:
  # A single coherent version + shared manifest metadata for every arch.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      base_image: ${{ steps.meta.outputs.base_image }}
      r_version: ${{ steps.meta.outputs.r_version }}
      python_version: ${{ steps.meta.outputs.python_version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Compute version + parse manifest
        id: meta
        run: |
          BASE_IMAGE=$(grep '^base_image:' "$MANIFEST" | awk '{print $2}' | tr -d '"')
          R_VERSION=$(grep '^r_version:' "$MANIFEST" | awk '{print $2}' | tr -d '"')
          PYTHON_VERSION=$(grep '^python_version:' "$MANIFEST" | awk '{print $2}' | tr -d '"')
          VERSION=$(date +%Y%m%d)-$(echo "${{ github.sha }}" | head -c 7)
          {
            echo "version=$VERSION"
            echo "base_image=$BASE_IMAGE"
            echo "r_version=$R_VERSION"
            echo "python_version=$PYTHON_VERSION"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      # Arch list — keep in lock-step with the workflow-level ARCHES env (manifest
      # combine loop) and the acceptance workflow matrix.
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: '["self-hosted", "inflexa-builder"]'
          - arch: arm64
            platform: linux/arm64
            runner: '["self-hosted", "inflexa-builder-arm64"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.prepare.outputs.version }}
      BASE_IMAGE: ${{ needs.prepare.outputs.base_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        # Use the docker daemon's built-in builder (not a docker-container builder):
        # its BuildKit cache lives in /var/lib/docker — the persistent EBS volume —
        # so warm layers survive the box's stop/start with no long-lived builder to
        # leave stale state, and no runner-writable cache dir to provision.
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker

      - name: Ensure zstd
        # AL2023 ships zstd; fail loudly rather than install (the runner user has no
        # sudo on the self-hosted builders).
        run: command -v zstd >/dev/null || { echo "::error::zstd not found on the builder"; exit 1; }

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One image, on this arch, tagged <image>:<version>-<arch>. `--load` puts it
      # in the local docker daemon so a later step can `docker run` it without a
      # pull-back; `docker push` then publishes it to GHCR. There is no inventory
      # label: the image bakes no /mnt/libs/current/packages.txt, because the
      # mounted store carries its own.

      - name: "Build + push: sandbox-base"
        run: |
          docker buildx build --load \
            -f images/sandbox-base/Dockerfile \
            --platform "$PLATFORM" \
            --build-arg "BASE_IMAGE=$BASE_IMAGE" \
            -t "${IMAGE_BASE}:${VERSION}-${ARCH}" \
            .
          docker push "${IMAGE_BASE}:${VERSION}-${ARCH}"

      # OPEN DECISION (task 7.1): the extraction cuts the per-track tarballs out of
      # a published image, and sandbox-base carries no R track and no Python track.
      # This step fails until the replacement source is decided. Do not point it at
      # a different artifact before that decision.
      - name: Extract per-track tarballs from the image
        id: extract
        run: |
          TOP="${IMAGE_BASE}:${VERSION}-${ARCH}"
          echo "top_image=$TOP" >> "$GITHUB_OUTPUT"
          bash scripts/lib-store-extract-tarballs.sh "$TOP" staging

      - name: Coverage report (want vs loaded, regression diff)
        id: coverage
        env:
          S3_BUCKET: ${{ vars.LIB_STORE_S3_BUCKET }}
        run: |
          # Best-effort baseline: the last published coverage for this arch, if any.
          PREV_ARG=()
          if [ -n "$S3_BUCKET" ] && aws s3 cp "s3://$S3_BUCKET/latest/linux-${ARCH}/coverage.json" prev-coverage.json 2>/dev/null; then
            PREV_ARG=(--previous prev-coverage.json)
          fi
          mkdir -p dist
          # amd64 regression → non-zero → fails the job (no publish). arm64 miss is
          # informational. The table is written to the step summary either way.
          python3 scripts/lib-store-coverage.py \
            --arch "$ARCH" --manifest "$MANIFEST" --store staging \
            --out dist/coverage.json "${PREV_ARG[@]}" | tee coverage.out
          cat coverage.out >> "$GITHUB_STEP_SUMMARY"

      - name: Pack per-track tarballs
        id: pack
        run: |
          bash scripts/lib-store-pack.sh staging dist
          {
            echo "## Image build ($ARCH)"
            echo "| Image | Result |"
            echo "|-|-|"
            echo "| sandbox-base | pushed |"
            echo "Extracted from: ${{ steps.extract.outputs.top_image }}"
            echo "Packed tracks: $(tr '\n' ' ' < dist/tracks.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish configuration
        id: publish
        run: |
          if [ -n "${{ vars.LIB_STORE_S3_BUCKET }}" ] && [ -n "${{ vars.LIB_STORE_PUBLISH_ROLE_ARN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::S3 publish skipped — set repo variables LIB_STORE_S3_BUCKET and LIB_STORE_PUBLISH_ROLE_ARN to enable the tarball upload. The images were still pushed to GHCR."
          fi

      - name: Configure AWS credentials
        if: steps.publish.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.LIB_STORE_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Publish track tarballs + candidate manifest + coverage
        if: steps.publish.outputs.enabled == 'true'
        env:
          S3_BUCKET: ${{ vars.LIB_STORE_S3_BUCKET }}
          PUBLIC_URL: ${{ vars.LIB_STORE_PUBLIC_URL || 'https://lib-store.inflexa.ai' }}
          R_VERSION: ${{ needs.prepare.outputs.r_version }}
          PYTHON_VERSION: ${{ needs.prepare.outputs.python_version }}
          GIT_SHA: ${{ github.sha }}
          TOP_IMAGE: ${{ steps.extract.outputs.top_image }}
        run: |
          scripts/lib-store-publish.sh "$ARCH" "$VERSION" dist
          # The coverage baseline travels with the immutable version, and advances
          # latest alongside the manifest (lib-store-publish.sh) so the next build's
          # regression diff references this build. Acceptance is non-gating and moves
          # neither.
          aws s3 cp dist/coverage.json "s3://$S3_BUCKET/$VERSION/linux-${ARCH}/coverage.json"
          aws s3 cp dist/coverage.json "s3://$S3_BUCKET/latest/linux-${ARCH}/coverage.json"

      - name: Record candidate metadata
        run: |
          mkdir -p candidate
          cat > "candidate/linux-${ARCH}.json" <<EOF
          {"version":"${VERSION}","arch":"linux-${ARCH}","publish":"${{ steps.publish.outputs.enabled }}","image":"${{ steps.extract.outputs.top_image }}"}
          EOF
          cat "candidate/linux-${ARCH}.json"

      - name: Upload candidate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lib-store-candidate-${{ matrix.arch }}
          path: candidate/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          docker rmi "${IMAGE_BASE}:${VERSION}-${ARCH}" 2>/dev/null || true
          rm -rf staging dist candidate
          docker image prune -f 2>/dev/null || true
          docker container prune -f 2>/dev/null || true

  # Combine the per-arch image tags into one multi-arch manifest list, so
  # `docker pull` resolves the host arch automatically. Only the arch tags that
  # actually built are included.
  manifest:
    needs: [prepare, build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifests
        run: |
          set -eu
          combine() {
            local image="$1"; shift
            local srcs=()
            # Arch list from the workflow-level ARCHES env (keep matrices in lock-step).
            for a in $ARCHES; do
              tag="${image}:${VERSION}-${a}"
              if docker buildx imagetools inspect "$tag" >/dev/null 2>&1; then srcs+=("$tag"); fi
            done
            if [ "${#srcs[@]}" -eq 0 ]; then
              echo "::warning::no arch tags for $image — skipping manifest"
              return 0
            fi
            docker buildx imagetools create -t "${image}:${VERSION}" -t "${image}:latest" "${srcs[@]}"
            echo "published ${image}:latest (${srcs[*]})"
          }
          combine "${IMAGE_BASE}"
