name: Lint

# Lints/typechecks the independent subsystems. `cli/` has ESLint + a tsc
# typecheck; `harness/` has a tsc typecheck plus ruff over its Python package
# asset; `prov-kernel/` has ESLint + a tsc typecheck over its test-inclusive
# config.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: lint (cli)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Every job installs the Bun that .bun-version names, so CI and developer
      # machines cannot drift apart unnoticed and a bump is one reviewable edit
      # rather than seven. The path resolves against the repo root
      # (GITHUB_WORKSPACE) — `uses:` steps ignore the job's working-directory.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # cli pins @inflexa-ai/harness to an exact published version and installs
      # it from npm (not file:../harness), so a plain install resolves it — no
      # in-repo harness build.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A PR can change cli and harness together, and its checks must run
      # against that pair. The npm pin cannot see an unpublished harness. Thus
      # this step links the working-copy harness over the installed one, the
      # same as `bun run harness:local` on a developer machine. The harness
      # install comes first, because the link script builds the harness. A push
      # to main keeps the npm pin: release.yml waits on the push checks as its
      # release gate, and they must run against the harness version that the
      # shipped binary bundles.
      - name: Use the local harness
        if: github.event_name == 'pull_request'
        run: |
          bun install --frozen-lockfile --cwd ../harness
          bun run harness:local

      - name: ESLint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Same category as ESLint: a source-validity gate. Generation fails on a
      # visible command/argument/option registered without a description, or a
      # registry that stops being importable standalone — catching it here keeps
      # the release workflow's docs packaging a pure re-run of what CI verified.
      - name: Docs generation check
        run: bun run docs:gen

  harness:
    name: lint (harness)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Every job installs the Bun that .bun-version names, so CI and developer
      # machines cannot drift apart unnoticed and a bump is one reviewable edit
      # rather than seven. The path resolves against the repo root
      # (GITHUB_WORKSPACE) — `uses:` steps ignore the job's working-directory.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc -p tsconfig.json --noEmit

      # The input-scan container decoder is Python shipped as a package asset, so
      # its linter is a source-validity gate like the typecheck above. Pinned into
      # a venv put on PATH, so `lint:python` resolves the same `ruff` here as on a
      # developer machine.
      - name: Set up Python tooling
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check ruff==0.14.10
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Ruff
        run: bun run lint:python

  prov-kernel:
    name: lint (prov-kernel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prov-kernel
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Every job installs the Bun that .bun-version names, so CI and developer
      # machines cannot drift apart unnoticed and a bump is one reviewable edit
      # rather than seven. The path resolves against the repo root
      # (GITHUB_WORKSPACE) — `uses:` steps ignore the job's working-directory.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      # The eslint tsconfig widens the build tsconfig to the colocated test
      # files, so the typecheck covers them too.
      - name: Typecheck
        run: bunx tsc -p tsconfig.eslint.json --noEmit
