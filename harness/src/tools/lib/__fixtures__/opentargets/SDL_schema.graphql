  "Target\u2013disease associations computed on the fly with configurable datasource weights and filters"
  associatedTargets(
    "List of disease or target IDs"
    Bs: [String!],

    "Use the disease ontology to retrieve all its descendants and capture their associated evidence."
    enableIndirect: Boolean,

    "List of datasource settings"
    datasources: [DatasourceSettingsInput!],

    "List of the facet IDs to filter by (using AND)"
    facetFilters: [String!],

    "Filter to apply to the ids with string prefixes"
    BFilter: String,

    "Ordering for the associations. Accepts a string with two words separated by a space. The first word is the column to sort by: either `score` to use the overall association score (default), a datasource id (e.g., `impc`), or a datatype id (e.g., `animal_model`). The second word is the order: `desc` (default) or `asc`."
    orderByScore: String,

    "Pagination settings with index and size"
    page: Pagination): AssociatedTargets!

  "All ancestor diseases in the ontology from this term up to the top-level therapeutic area"
  resolvedAncestors: [Disease!]!

  "Clinical indications for this disease as reported by clinical trial records."
  drugAndClinicalCandidates: clinicalIndicationsFromDiseaseImp!

  "Association time series"
  associationTimeSeries(
    "Ensembl ID"
    ensemblId: String!,

    "Whether to include only direct associations/evidence (true), or also indirect ones (false)."
    isDirect: Boolean!,

    "Aggregation types"
    aggregationTypes: [AggregationTypeEnum!],

    "Year at the lower end of the filter"
    startYear: Int,

    "Year at the higher end of the filter"
    endYear: Int,

    "Pagination settings with index and size"
    page: Pagination): AssociationTimeSeriesResults!
}

