    "Ensembl ID"
    ensemblId: String!): Target

  "Retrieve multiple targets by target identifiers"
  targets(
    "List of Ensembl IDs"
    ensemblIds: [String!]!): [Target!]!

  "Retrieve a disease or phenotype by identifier (e.g. EFO_0000400)"
  disease(
    "EFO ID"
    efoId: String!): Disease

  "Retrieve multiple diseases by disease or phenotype identifiers"
  diseases(
    "EFO ID"
    efoIds: [String!]!): [Disease!]!

  "Retrieve a drug or clinical candidate by identifier (e.g. CHEMBL112)"
  drug(
    "Chembl ID"
    chemblId: String!): Drug

  "Retrieve multiple drugs or clinical candidates by identifiers"
  drugs(
    "List of Chembl IDs"
    chemblIds: [String!]!): [Drug!]!

  "Full-text, multi-entity search across all types of entities (targets, diseases, drugs, variants or studies)"
  search(
    "Search query string"
    queryString: String!,

    "List of entity names to search for (target, disease, drug,...)"
    entityNames: [String!],

    "Pagination settings with index and size"
    page: Pagination): SearchResults!

  "Search sets of targets or diseases used to facet associations"
  facets(
    "Search query string"
    queryString: String,

    "List of entity names to search for (target, disease, drug,...)"
    entityNames: [String!],

    "Category filter"
    category: String,

    "Pagination settings with index and size"
    page: Pagination): SearchFacetsResults!

  "Map free-text terms to canonical IDs used as primary identifiers in the Platform (targets, diseases, drugs, variants or studies). For example, mapping 'diabetes' to EFO_0000400 or 'BRCA1' to ENSG00000139618"
  mapIds(
    "List of query terms to map"
    queryTerms: [String!]!,

    "List of entity names to search for (target, disease, drug,...)"
    entityNames: [String!]): MappingResults!

  "List of available evidence datasources and their datatypes"
  associationDatasources: [EvidenceSource!]!

  "List of molecular interaction resources and their versions"
  interactionResources: [InteractionResources!]!

  "Fetch Gene Ontology terms by GO identifiers"
  geneOntologyTerms(
    "List of GO IDs, eg. GO:0005515"
    goIds: [String!]!): [GeneOntologyTerm]!

  "Retrieve a variant by identifier in the format of CHROM_POS_REF_ALT for SNPs and short indels (e.g. 19_44908684_T_C)"
  variant(
    "Variant ID"
    variantId: String!): Variant

  "Retrieve a GWAS or molecular QTL study by ID (e.g. GCST004131)"
  study(
    "Study ID"
    studyId: String): Study

  "List GWAS or molecular QTL studies filtered by ID(s) and/or disease(s); supports ontology expansion"
  studies(
    "Pagination settings with index and size"
    page: Pagination,

    "Study ID"
    studyId: String,

    "Disease IDs"
    diseaseIds: [String!],

    "Use the disease ontology to retrieve all its descendants and capture all their associated studies."
    enableIndirect: Boolean): Studies!

  "Retrieve a 95% credible set (study-locus) by identifier"
  credibleSet(
    "Study-locus ID"
    studyLocusId: String!): CredibleSet

  "List credible sets filtered by study-locus IDs, study IDs, variant IDs, study types or regions"
  credibleSets(
    "Pagination settings with index and size"
    page: Pagination,

    "Study-locus IDs"
    studyLocusIds: [String!],

    "Study IDs"
    studyIds: [String!],

    "List of variant IDs in CHROM_POS_REF_ALT format"
    variantIds: [String!],

    "Study types"
    studyTypes: [StudyTypeEnum!],

    "List of genomic regions (e.g., 1:100000-200000)"
    regions: [String!]): CredibleSets!
  clinicalReport(
    "Clinical Report ID"
    clinicalReportId: String!): ClinicalReport
  clinicalReports(
    "List of Clinical Report IDs"
    clinicalReportsIds: [String!]!): [ClinicalReport!]!
}

