id: R-0118
title: "Transcription factor activity without replication: descriptive scores only, no activity p-value"
assertion: >-
  If any group holds one sample, compute the transcription factor activity
  scores as a description only. Without within-group replication no
  between-group variance can be estimated, thus a p-value on a score
  difference has no inferential basis, and a gene-level statistic from such a
  design is a descriptive fold change and not a test statistic. Report the
  score per sample and regulator, or the score on the descriptive log2 fold
  change, and state that the design has no replication. Do not report an
  adjusted p-value on the activities.
modality: bulk_rna_seq
conditions:
  - field: n_per_group_min
    op: lt
    value: 2
action:
  step_type: tf_activity
  method: M-0035
  outcome: descriptive_only
  parameters:
    - name: activity_inference
      value: descriptive_scores_no_p_value
      default_source: "doi:10.1261/rna.053959.115"
severity: flag
strength: consensus
evidence_quality: high
recommendation_strength: strong
evidence:
  - direction: supports
    eco: ECO:0000033
    cito: cito:supports
    source: S-0011
    paraphrase: >-
      The study measures how the number of replicates changes the ability of
      each tool to find true differentially expressed genes, and it
      recommends at least six replicates per condition, thus a design with
      one sample per group is below every tested design.
    anchor: "Abstract; Discussion"
    retrieved: "2026-09-06"
  - direction: supports
    eco: ECO:0000033
    cito: cito:supports
    source: S-0002
    paraphrase: >-
      The vignette states that an experiment without replicates gives no
      valid estimate of the within-group variance, and it advises against
      inference from such data.
    anchor: "Experiments without replicates"
    retrieved: "2026-09-06"
status: active
