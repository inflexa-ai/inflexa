id: R-0126
title: "xCell for 64 cell types: an enrichment score per type with spillover compensation, not a proportion"
assertion: >-
  When the composition question names cell types beyond the immune and
  stromal populations of a marker-based score, compute xCell scores for its
  64 cell types on the human expression matrix. xCell gives a rank-based
  enrichment score per sample and per cell type, and it applies a spillover
  compensation between related types. The score is an enrichment score and
  not a proportion, thus the scores do not sum to one and a score of one type
  is not comparable with a score of another type. Report the score as a
  between-sample measure per type, and state that a related type can still
  carry a share of the signal of its neighbor after the compensation. xCell2
  is the Bioconductor successor that trains a signature set on a custom
  reference, with the same enrichment nature of the score.
modality: bulk_rna_seq
conditions:
  - field: organism
    op: eq
    value: human
action:
  step_type: deconvolution
  method: M-0042
  parameters:
    - name: cell_types
      value: 64_types_with_spillover_compensation
      default_source: "doi:10.1186/s13059-017-1349-1"
    - name: score_nature
      value: enrichment_not_proportion
      default_source: "doi:10.1186/s13059-017-1349-1"
severity: info
