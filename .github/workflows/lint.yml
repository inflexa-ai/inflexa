name: Lint

# Lints/typechecks the independent subsystems. `cli/` has ESLint + a tsc
# typecheck; `harness/` has no ESLint config, so its lint is the tsc typecheck.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: lint (cli)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Keep the manifest's exact npm pin intact for standalone installs, then
      # link the sibling checkout for this source-level integration gate.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build in-repo harness
        working-directory: harness
        run: |
          bun install --frozen-lockfile
          bun run build
          bun link

      - name: Link in-repo harness
        run: bun link @inflexa-ai/harness

      - name: ESLint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Same category as ESLint: a source-validity gate. Generation fails on a
      # visible command/argument/option registered without a description, or a
      # registry that stops being importable standalone — catching it here keeps
      # the release workflow's docs packaging a pure re-run of what CI verified.
      - name: Docs generation check
        run: bun run docs:gen

  harness:
    name: lint (harness)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc -p tsconfig.json --noEmit
