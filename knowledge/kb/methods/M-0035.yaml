id: M-0035
label: "Transcription factor activity with decoupleR ulm on the CollecTRI regulons"
edam_operation: EDAM:operation_3501
description: >-
  A univariate linear model per regulator: the gene-level statistic of a
  contrast, or the log expression of one sample, regressed on the signed
  target weights of the regulator. The t-value of the slope is the activity
  score. The regulons come from CollecTRI, a signed network of transcription
  factors and their targets from twelve resources, and a regulator enters the
  test only when at least a minimum number of its targets are in the tested
  genes. The multivariate linear model (mlm) over all regulators at once is
  the second estimator of the same package.
packages:
  - name: decoupleR
    track: bioconductor
    biotools: decoupler
    version_range: ">=2.10"
    bioconductor: "3.23"
  - name: DESeq2
    track: bioconductor
    biotools: deseq2
    version_range: ">=1.50"
    bioconductor: "3.23"
  - name: ggplot2
    track: cran
    version_range: ">=3.5"
  - name: pheatmap
    track: cran
    version_range: ">=1.0"
  - name: jsonlite
    track: cran
    version_range: ">=1.8"
  - name: decoupler
    track: python
    version_range: ">=2.0"
  - name: pydeseq2
    track: python
    version_range: ">=0.5"
templates:
  - tpl-decoupler-tf-activity
  - tpl-decoupler-py-tf-activity
