id: tpl-gseapy-ora
version: 1.0.0
label: "Over-representation analysis with an explicit universe, gseapy enrich"
language: python
method: M-0011
step_types: [enrichment]
edam_operations: [EDAM:operation_3501]
citations: [S-0019, S-0026, S-0027, S-0028, S-0031]
license: Apache-2.0
applicability:
  modality: bulk_rna_seq
  notes: >-
    The Python mirror of tpl-ora-universe. A differential expression results
    table with the columns `gene`, `log2_fold_change`, and `adjusted_pvalue`,
    plus a GMT file of gene sets in the same identifier space. The universe is
    the set of tested genes: every row with a non-missing adjusted p-value. The
    gene list is the rows under the adjusted p-value cutoff and over the fold
    change cutoff, in the selected direction. The test is the hypergeometric
    test of gseapy.enrich with the tested genes as the background and
    Benjamini-Hochberg adjustment, and every set with an overlap is reported.
    The GMT is read from a local path, and no network call occurs.
parameters:
  - name: results_path
    type: string
    description: "Path of the differential expression results CSV with the columns gene, log2_fold_change, and adjusted_pvalue."
    adaptable: true
  - name: gmt_path
    type: string
    description: "Path of the GMT file of gene sets, one set per line, in the identifier space of the results table."
    adaptable: true
  - name: padj_cutoff
    type: number
    description: "A gene enters the gene list when its adjusted p-value is under this cutoff."
    adaptable: true
    default: 0.05
    default_source: "doi:10.1038/s41596-018-0103-9"
    minimum: 0
    maximum: 1
  - name: lfc_cutoff
    type: number
    description: "A gene enters the gene list when its absolute log2 fold change is at least this value. 0 applies no fold change filter."
    adaptable: true
    default: 0
    default_source: "doi:10.1038/s41596-018-0103-9"
    minimum: 0
  - name: direction
    type: string
    description: "The direction of the gene list: both signs, only the up-regulated genes, or only the down-regulated genes."
    adaptable: true
    default: both
    default_source: "doi:10.1038/s41596-018-0103-9"
    enum: [both, up, down]
  - name: min_size
    type: integer
    description: "A gene set is tested when at least this many of its genes are in the universe."
    adaptable: true
    default: 15
    default_source: "doi:10.1038/s41596-018-0103-9"
    minimum: 1
  - name: max_size
    type: integer
    description: "A gene set is tested when at most this many of its genes are in the universe."
    adaptable: true
    default: 500
    default_source: "doi:10.1038/s41596-018-0103-9"
    minimum: 1
  - name: output_prefix
    type: string
    description: "The prefix of the output files, for example ora or ora_up."
    adaptable: true
    default: ora
    pattern: "^[A-Za-z0-9_.-]+$"
inputs:
  - name: results
    path: "{{results_path}}"
    format: EDAM:format_3752
    description: "Differential expression results, one row per gene, CSV."
  - name: gene_sets
    path: "{{gmt_path}}"
    format: EDAM:format_2330
    description: "Gene sets, GMT."
outputs:
  - name: results
    path: "output/{prefix}_results.csv"
    format: EDAM:format_3752
    description: "One row per tested gene set: pathway, size (set genes in the universe), overlap (set genes in the gene list), fold_enrichment, pvalue, padj, genes (semicolon-joined)."
  - name: summary
    path: "output/{prefix}_summary.json"
    format: EDAM:format_3464
    description: "The inputs, the size of the gene list and of the universe, the counts of tested and significant sets, the thresholds, the package versions."
  - name: dot_plot
    path: "figures/{prefix}_dotplot.png"
    description: "Dot plot of the top 20 sets by adjusted p-value: fold enrichment against set, sized by overlap, colored by padj (and PDF)."
  - name: bar_plot
    path: "figures/{prefix}_barplot.png"
    description: "Bar plot of the top 20 sets by adjusted p-value: -log10 padj per set, filled by overlap (and PDF)."
  - name: session
    path: "output/session_info.txt"
    description: "The Python version and each package version for the record."
environment:
  - name: gseapy
    version: "1.3.1"
    track: python
  - name: pandas
    version: "3.0.5"
    track: python
  - name: numpy
    version: "2.5.2"
    track: python
  - name: matplotlib
    version: "3.11.1"
    track: python
bioconductor: "3.23"
body_file: body.py
tests:
  - name: two-group-n6-hallmark
    dataset: two_group_n6/seed-1
    slots:
      results_path: /work/data/de_results.csv
      gmt_path: /work/refs/hallmark.gmt
    expect:
      - "exists output/ora_results.csv"
      - "exists output/ora_summary.json"
      - "exists output/session_info.txt"
      - "exists figures/ora_dotplot.png"
      - "exists figures/ora_dotplot.pdf"
      - "exists figures/ora_barplot.png"
      - "exists figures/ora_barplot.pdf"
      - "csv_rows output/ora_results.csv >= 40"
      - "json output/ora_summary.json n_universe >= 5000"
      - "json output/ora_summary.json n_sets_tested >= 40"
      - "truth_set_recall output/ora_results.csv >= 0.66"
