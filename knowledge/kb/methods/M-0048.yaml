id: M-0048
label: "Consensus clustering of samples with ConsensusClusterPlus"
edam_operation: EDAM:operation_3432
description: >-
  Unsupervised class discovery among the samples by repeated clustering of
  subsamples of the items and the features. The consensus matrix holds the
  share of the subsamples in which two samples fall into the same cluster.
  The consensus cumulative distribution function, the relative change in its
  area, the proportion of ambiguous clustering, and the item-consensus and
  cluster-consensus values give the evidence for a number of clusters. The
  input is the most variable genes of a variance-stabilized or log-scale
  matrix, with a stated distance and a stated linkage or partition method.
packages:
  - name: ConsensusClusterPlus
    track: bioconductor
    biotools: consensusclusterplus
    version_range: ">=1.70"
    bioconductor: "3.23"
  - name: cluster
    track: cran
    version_range: ">=2.1"
  - name: DESeq2
    track: bioconductor
    biotools: deseq2
    version_range: ">=1.50"
    bioconductor: "3.23"
  - name: ggplot2
    track: cran
    version_range: ">=3.5"
  - name: pheatmap
    track: cran
    version_range: ">=1.0"
  - name: jsonlite
    track: cran
    version_range: ">=1.8"
templates:
  - tpl-consensus-clustering
