id: M-0049
label: "variancePartition: the share of the variance of each gene explained by each factor of the design"
description: >-
  A linear mixed model per gene on the log-scale expression, with each
  categorical variable of the design as a random effect and each continuous
  variable as a fixed effect. The model divides the variance of each gene
  into the share of each variable and a residual share. The distribution of
  the shares across the genes shows which variables drive the expression,
  whether a batch or a technical variable explains more than the condition,
  and whether a variable is redundant, before the differential expression
  test. On counts the input is the log-CPM with the voom precision weights.
packages:
  - name: variancePartition
    track: bioconductor
    biotools: variancepartition
    version_range: ">=1.40"
    bioconductor: "3.23"
  - name: lme4
    track: cran
    version_range: ">=1.1"
  - name: limma
    track: bioconductor
    biotools: limma
    version_range: ">=3.60"
    bioconductor: "3.23"
  - name: edgeR
    track: bioconductor
    biotools: edger
    version_range: ">=4.0"
    bioconductor: "3.23"
  - name: BiocParallel
    track: bioconductor
    version_range: ">=1.40"
    bioconductor: "3.23"
  - name: ggplot2
    track: cran
    version_range: ">=3.5"
  - name: jsonlite
    track: cran
    version_range: ">=1.8"
templates:
  - tpl-variance-partition
