id: tpl-limma-trend-timecourse
version: 1.0.0
label: "limma-trend moderated F-test for a time course on log-scale expression values, with a condition or with one group"
language: R
method: M-0005
step_types: [filter_low_counts, normalize, model_design, differential_expression, multiple_testing]
edam_operations: [EDAM:operation_3223]
citations: [S-0007, S-0008, S-0041, S-0042, S-0059, S-0067, S-0075]
license: Apache-2.0
applicability:
  modality: bulk_rna_seq
  design_patterns: [time_course_with_condition, time_course_one_group]
  honors: [pairing, blocking_factor, covariates, batch]
  min_replicates: 2
  conditions:
    - field: data_state
      op: in
      value: [tpm_or_fpkm, log_normalized]
    - field: n_timepoints
      op: gte
      value: 2
    - field: interaction
      op: is_null
  notes: >-
    An abundance matrix whose first column is the gene identifier and whose
    header holds the sample identifiers, plus a sample table with one row per
    sample, a time column, and, with two or more groups, a condition column.
    The values are TPM, FPKM, or RPKM on the linear scale, or values that are
    already on a log2 scale. A linear-scale value becomes log2(value +
    offset). No count model applies to such values. The condition column is
    renamed to `condition` and the time column to `time` inside the script,
    thus the designs name `condition`, `time`, and any other column of the
    sample table by its own name; a repeated subject enters both designs as a
    fixed block. The test is the moderated F-test over the coefficients that
    the full design holds and the reduced design does not: with a condition
    the condition:time terms, with one group the time terms against ~ 1.
parameters:
  - name: abundance_path
    type: string
    description: "Path of the abundance matrix CSV, first column gene id, header sample ids, TPM or FPKM or RPKM, or log2 values when values_are_log is true."
    adaptable: true
  - name: metadata_path
    type: string
    description: "Path of the sample table CSV with one row per sample."
    adaptable: true
  - name: sample_id_column
    type: string
    description: "The column of the sample table that holds the sample identifiers that match the abundance matrix header."
    adaptable: true
    default: sample
  - name: condition_column
    type: string
    description: "The column of the sample table that holds the condition of interest. Absent for one group over time; then the designs name time only."
    adaptable: true
    required: false
  - name: reference_level
    type: string
    description: "The level of the condition that is the denominator of the per-timepoint fold changes, for example control. Absent for one group over time."
    adaptable: true
    required: false
  - name: time_column
    type: string
    description: "The column of the sample table that holds the time point of each sample. The script treats it as a factor."
    adaptable: true
  - name: time_order
    type: string_list
    description: "The time levels in their order, first level first. Absent, the levels come in the order of first appearance in the sample table."
    adaptable: true
    required: false
  - name: full_design
    type: formula
    description: "The full design. It must name time, and condition when a condition column is set, and it holds the terms that the test removes. Put a balanced batch, a covariate, or a repeated subject first, for example ~ subject + condition + time + condition:time. For one group over time: ~ time."
    adaptable: true
    default: "~ condition + time + condition:time"
    default_source: "guide:limma/2026-05-19#time-course-experiments"
    pattern: "\\btime\\b"
  - name: reduced_design
    type: formula
    description: "The reduced design. Each of its terms must be in the full design. The test asks whether the coefficients that only the full design holds matter together. For one group over time: ~ 1."
    adaptable: true
    default: "~ condition + time"
    default_source: "guide:limma/2026-05-19#time-course-experiments"
  - name: values_are_log
    type: boolean
    description: "True when the matrix already holds log2 values, for example log-CPM or microarray intensities. False when it holds TPM, FPKM, or RPKM on the linear scale, which the script transforms with log2(value + log_offset)."
    adaptable: true
    default: false
  - name: log_offset
    type: number
    description: "The offset added before the log2 transform of a linear-scale value, to keep a zero finite and to damp the variance of a low value. Unused when values_are_log is true."
    adaptable: true
    default: 1
    default_source: "guide:limma/2026-05-19#limma-trend"
    minimum: 0
  - name: expression_floor
    type: number
    description: "A gene stays when its log2 expression is at least this floor in at least min_samples samples. 1 keeps a gene with TPM of at least 1 under the default offset."
    adaptable: true
    default: 1
    default_source: "guide:limma/2026-05-19#filtering"
  - name: min_samples
    type: integer
    description: "The minimum number of samples for the expression filter. Absent, the script uses the smallest condition-by-time cell size."
    adaptable: true
    required: false
    minimum: 1
  - name: trend
    type: boolean
    description: "The trend argument of eBayes: the prior variance follows the mean log expression. The method is limma-trend, thus the value is pinned to true."
    adaptable: false
    default: true
    default_source: "guide:limma/2026-05-19#limma-trend"
  - name: robust
    type: boolean
    description: "The robust argument of eBayes: the hyperparameters are estimated with protection against a hypervariable gene."
    adaptable: true
    default: true
    default_source: "doi:10.1214/16-AOAS920"
  - name: alpha
    type: number
    description: "The adjusted p-value cutoff that counts a gene as significant in the summary and the figures."
    adaptable: false
    default: 0.05
    default_source: "guide:limma/2026-05-19#multiple-testing-across-genes-and-contrasts"
  - name: n_top_genes_mds
    type: integer
    description: "The number of most variable genes for the MDS plot."
    adaptable: true
    default: 500
    default_source: "doi:10.12688/f1000research.9005.3"
    minimum: 50
  - name: n_top_genes_heatmap
    type: integer
    description: "The number of top F-test genes, by p-value, in the heatmap of the log2 expression values."
    adaptable: true
    default: 50
    minimum: 2
  - name: output_prefix
    type: string
    description: "The prefix of the output files, for example de or treated_time_course."
    adaptable: true
    default: de
    pattern: "^[A-Za-z0-9_.-]+$"
inputs:
  - name: abundance
    path: "{{abundance_path}}"
    format: EDAM:format_3752
    description: "Gene by sample abundance values, CSV: TPM, FPKM, RPKM, or log2 values."
  - name: metadata
    path: "{{metadata_path}}"
    format: EDAM:format_3752
    description: "Sample table, CSV."
outputs:
  - name: f_test_results
    path: "output/{prefix}_f_test_results.csv"
    format: EDAM:format_3752
    description: "One row per tested gene: gene, log_expression_mean, f_stat, pvalue, adjusted_pvalue (BH) of the moderated F-test over the coefficients the reduced design drops."
  - name: timepoint_lfc
    path: "output/{prefix}_timepoint_lfc.csv"
    format: EDAM:format_3752
    description: "The significant genes with the adjusted p-value and one column per contrast: lfc_<level>_vs_<reference>_at_<time> for the condition effect at each time point, and lfc_<time>_vs_<first>[_in_<level>] for each time point against the first."
  - name: log_expression
    path: "output/{prefix}_log_expression.csv"
    format: EDAM:format_3752
    description: "The log2 expression values after the filter, genes by samples, for downstream visualization."
  - name: summary
    path: "output/{prefix}_summary.json"
    format: EDAM:format_3464
    description: "The designs, the coefficients tested, the condition and time levels, the contrasts, the transform, the counts of tested and significant genes, the thresholds, the package versions."
  - name: mds
    path: "figures/{prefix}_mds.png"
    description: "MDS plot of the samples on the top variable genes, colored by condition with the time as the shape, or colored by time for one group (and PDF)."
  - name: mean_variance
    path: "figures/{prefix}_mean_variance.png"
    description: "The limma-trend mean-variance relation with the fitted trend (and PDF)."
  - name: heatmap
    path: "figures/{prefix}_top_genes_heatmap.png"
    description: "Heatmap of the top F-test genes, log2 expression scaled by row, samples ordered by condition and time (and PDF)."
  - name: session
    path: "output/session_info.txt"
    description: "R session information for the record."
environment:
  - name: limma
    version: "3.68.5"
    track: bioconductor
  - name: ggplot2
    version: "4.0.3"
    track: cran
  - name: pheatmap
    version: "1.0.13"
    track: cran
  - name: jsonlite
    version: "2.0.0"
    track: cran
bioconductor: "3.23"
body_file: body.R
tests:
  - name: timecourse-2x4-n3-log
    dataset: timecourse_2x4_n3/seed-1
    slots:
      abundance_path: /work/data/log_expr.csv
      metadata_path: /work/data/metadata.csv
      condition_column: condition
      reference_level: control
      time_column: time
      values_are_log: true
    expect:
      - "exists output/de_f_test_results.csv"
      - "exists output/de_timepoint_lfc.csv"
      - "exists output/de_summary.json"
      - "exists output/de_log_expression.csv"
      - "exists output/session_info.txt"
      - "exists figures/de_mds.png"
      - "exists figures/de_mds.pdf"
      - "exists figures/de_mean_variance.png"
      - "exists figures/de_top_genes_heatmap.png"
      - "exists figures/de_top_genes_heatmap.pdf"
      - "csv_rows output/de_f_test_results.csv >= 5000"
      - "json output/de_summary.json df_tested == 3"
      - "json output/de_summary.json n_condition_levels == 2"
      # A 3 df interaction at three samples per cell on log2(TPM + 1): recall 0.19 with the false discovery proportion below 0.1; the count model on the same design reaches 0.4.
      - "truth_recall output/de_f_test_results.csv >= 0.15"
      - "truth_fdr output/de_f_test_results.csv <= 0.15"
  - name: timecourse-1x4-n3-log
    dataset: timecourse_1x4_n3/seed-1
    slots:
      abundance_path: /work/data/log_expr.csv
      metadata_path: /work/data/metadata.csv
      time_column: time
      full_design: "~ time"
      reduced_design: "~ 1"
      values_are_log: true
      output_prefix: time
    expect:
      - "exists output/time_f_test_results.csv"
      - "exists output/time_timepoint_lfc.csv"
      - "exists output/time_summary.json"
      - "exists figures/time_mds.png"
      - "csv_rows output/time_f_test_results.csv >= 5000"
      - "csv_rows output/time_timepoint_lfc.csv >= 100"
      - "json output/time_summary.json df_tested == 3"
      - "json output/time_summary.json n_condition_levels == 1"
      - "truth_recall output/time_f_test_results.csv >= 0.3"
      - "truth_fdr output/time_f_test_results.csv <= 0.15"
