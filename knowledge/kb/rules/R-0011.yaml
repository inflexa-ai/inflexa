id: R-0011
title: "Paired design: DESeq2 with the subject as a blocking term"
assertion: >-
  If the samples are paired, for example one treated and one untreated sample
  from each subject, put the subject in the design formula before the
  condition. Fit the DESeq2 Wald test with the design ~ subject + condition,
  and report the condition coefficient with apeglm shrinkage. The subject term
  removes the between-subject variation from the test, thus the comparison is
  made within each subject. If the block is unbalanced, or if a random effect for the subject is wanted, use limma-voom with duplicateCorrelation.
  If the subjects are split between the conditions and each subject gives
  samples over time, a fixed subject term absorbs the condition, thus the
  repeated measures rule applies instead.
modality: bulk_rna_seq
conditions:
  - field: data_state
    op: eq
    value: counts
  - field: paired
    op: eq
    value: true
  - field: n_per_group_min
    op: gte
    value: 2
  - field: n_per_group_max
    op: lte
    value: 11
  - field: n_groups
    op: gte
    value: 2
  - field: n_timepoints
    op: is_null
action:
  step_type: differential_expression
  method: M-0001
  parameters:
    - name: design_terms
      value: [subject, condition]
      default_source: "vignette:DESeq2/1.52.0#multi-factor-designs"
severity: info
strength: consensus
evidence_quality: high
recommendation_strength: strong
alternatives:
  - method: M-0004
    when: "The block is unbalanced, or a random effect for the subject is wanted instead of a fixed term."
evidence:
  - direction: supports
    eco: ECO:0000033
    cito: cito:usesMethodIn
    source: S-0002
    paraphrase: >-
      The vignette builds a design formula with more than one factor, where
      the nuisance factor comes first and the condition of interest comes
      last. The model accounts for the effect of the added factor, and the
      results are extracted for the condition of interest.
    anchor: "Multi-factor designs"
    retrieved: "2026-09-03"
  - direction: supports
    eco: ECO:0000033
    cito: cito:supports
    source: S-0042
    paraphrase: >-
      The guide models a blocked design by adding the block, such as the
      subject or the patient, as a factor in the design matrix beside the
      treatment, thus the treatment effect is estimated within the block and
      the variation between blocks does not enter the comparison.
    anchor: "Accounting for factors that are not of interest; Time series experiment with repeated mouse measurements nested within treatments"
    retrieved: "2026-09-03"
  - direction: supports
    eco: ECO:0000033
    cito: cito:usesMethodIn
    source: S-0040
    paraphrase: >-
      The workflow analyzes four cell lines, each with a treated and an
      untreated sample, with the design ~ cell + dex. The cell line enters as
      a blocking term, and the treatment effect is tested within the cell
      line, with the variable of interest last in the formula.
    anchor: "The DESeqDataSet object, sample information and the design formula; Running the differential expression pipeline"
    retrieved: "2026-09-03"
status: active
