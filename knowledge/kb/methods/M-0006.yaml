id: M-0006
label: "Sample structure QC: vst(blind), PCA, sample distances, library sizes"
description: >-
  Variance stabilizing transformation blind to the design, PCA on the most
  variable genes, a Euclidean sample distance heatmap, and library size and
  detected gene counts per sample. Colored by condition and by batch.
packages:
  - name: DESeq2
    track: bioconductor
    biotools: deseq2
    version_range: ">=1.50"
    bioconductor: "3.23"
  - name: scikit-learn
    track: python
    version_range: ">=1.5"
templates:
  - tpl-qc-eda
  - tpl-qc-python
