[project]
name = "inflexa-container-readout"
version = "0.0.0"
description = "Input-scan header readouts for containers a bounded file prefix cannot reach."
requires-python = ">=3.10"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-p no:cacheprovider"
