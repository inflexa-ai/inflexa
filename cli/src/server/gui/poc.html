<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Inflexa (proof of concept)</title>
        <style>
            body {
                margin: 0;
                display: grid;
                grid-template-columns: 18rem 18rem 1fr;
                height: 100vh;
                font:
                    14px system-ui,
                    sans-serif;
            }
            section {
                overflow: auto;
                padding: 0 0.75rem;
                border-right: 1px solid #ccc;
            }
            li {
                cursor: pointer;
            }
            .selected {
                font-weight: bold;
            }
            .message {
                margin: 0.5rem 0;
                white-space: pre-wrap;
            }
            .error {
                color: #b00020;
                white-space: pre-wrap;
            }
            textarea {
                box-sizing: border-box;
                width: 100%;
            }
        </style>
    </head>
    <body>
        <section>
            <h3>Analyses</h3>
            <ul id="analyses"></ul>
            <h3>Runs</h3>
            <ul id="runs"></ul>
        </section>
        <section>
            <h3>Threads</h3>
            <button id="new-thread" type="button" disabled>New thread</button>
            <ul id="threads"></ul>
        </section>
        <section>
            <h3>Messages</h3>
            <div id="messages"></div>
            <form id="chat">
                <textarea id="input" rows="3" disabled></textarea>
                <button id="send" disabled>Send</button>
                <button id="stop" type="button" disabled>Stop</button>
            </form>
            <div id="error" class="error"></div>
        </section>
        <script>
            "use strict";
            // The token is in the URL fragment, which a browser never sends to the server, thus no request log holds it.
            const token = new URLSearchParams(location.hash.slice(1)).get("token");
            const state = { analysisId: null, threadId: null, turn: null, runsTimer: null };
            const $ = (id) => document.getElementById(id);

            async function call(method, path, body) {
                const headers = { Authorization: `Bearer ${token}` };
                if (body !== undefined) headers["Content-Type"] = "application/json";
                const response = await fetch(`/api/v1${path}`, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
                if (!response.ok) throw new Error(`${method} ${path}: ${response.status} ${await response.text()}`);
                return response;
            }

            async function api(method, path, body) {
                return (await call(method, path, body)).json();
            }

            function guard(action) {
                $("error").textContent = "";
                action().catch((e) => ($("error").textContent = e.message));
            }

            function item(text, className) {
                const li = document.createElement("li");
                li.textContent = text;
                if (className) li.className = className;
                return li;
            }

            function select(list, chosen) {
                for (const li of $(list).children) li.classList.toggle("selected", li === chosen);
            }

            function messageBlock(role, text) {
                const div = document.createElement("div");
                div.className = "message";
                div.textContent = `${role}: ${text}`;
                return div;
            }

            function partText(part) {
                if (part.type === "text") return part.text;
                if (part.type === "tool-call") return `\n[tool ${part.toolName}]\n`;
                return `\n[${part.type}]\n`;
            }

            function setChatEnabled(enabled) {
                $("input").disabled = !enabled;
                $("send").disabled = !enabled;
            }

            async function loadAnalyses() {
                const { analyses } = await api("GET", "/analyses");
                $("analyses").replaceChildren(
                    ...analyses.map((analysis) => {
                        const li = item(analysis.name);
                        li.onclick = () => guard(() => selectAnalysis(analysis.id, li));
                        return li;
                    }),
                );
            }

            async function selectAnalysis(analysisId, li) {
                select("analyses", li);
                state.analysisId = analysisId;
                state.threadId = null;
                $("messages").replaceChildren();
                $("new-thread").disabled = false;
                setChatEnabled(false);
                clearInterval(state.runsTimer);
                state.runsTimer = setInterval(loadRuns, 5000);
                await Promise.all([loadThreads(), loadRuns()]);
            }

            async function loadRuns() {
                const analysisId = state.analysisId;
                try {
                    const { runs } = await api("GET", `/analyses/${analysisId}/runs`);
                    if (analysisId !== state.analysisId) return;
                    const rows = runs.map((run) => item(`${run.status} · ${run.planTitle ?? run.workflowName} · ${new Date(run.startedAt).toLocaleString()}`));
                    $("runs").replaceChildren(...(rows.length > 0 ? rows : [item("No runs.")]));
                } catch (e) {
                    if (analysisId === state.analysisId) $("runs").replaceChildren(item(e.message, "error"));
                }
            }

            async function loadThreads() {
                const { threads } = await api("GET", `/analyses/${state.analysisId}/threads`);
                $("threads").replaceChildren(
                    ...threads.map((thread) => {
                        const li = item(`${thread.title ?? "(no title)"}${thread.threadType === "report" ? " [report]" : ""}`);
                        if (thread.id === state.threadId) li.className = "selected";
                        li.onclick = () => guard(() => selectThread(thread.id, li));
                        return li;
                    }),
                );
            }

            async function selectThread(threadId, li) {
                select("threads", li);
                state.threadId = threadId;
                setChatEnabled(state.turn === null);
                await loadMessages();
            }

            async function loadMessages() {
                const { analysisId, threadId } = state;
                const { messages } = await api("GET", `/analyses/${analysisId}/threads/${threadId}/messages`);
                if (threadId !== state.threadId) return;
                $("messages").replaceChildren(...messages.map((message) => messageBlock(message.role, message.parts.map(partText).join(""))));
            }

            // A chat turn creates the thread of a new id, thus a new thread needs no request of its own.
            $("new-thread").onclick = () => {
                select("threads", null);
                state.threadId = crypto.randomUUID();
                $("messages").replaceChildren();
                setChatEnabled(state.turn === null);
            };

            $("chat").onsubmit = (event) => {
                event.preventDefault();
                guard(send);
            };

            async function send() {
                const message = $("input").value.trim();
                if (message === "" || state.turn !== null) return;
                const { analysisId, threadId } = state;
                const reply = messageBlock("assistant", "");
                $("input").value = "";
                $("messages").append(messageBlock("user", message), reply);
                setChatEnabled(false);
                try {
                    const response = await call("POST", `/analyses/${analysisId}/chat`, { threadId, message });
                    state.turn = { analysisId, threadId, turnId: response.headers.get("Inflexa-Turn-Id") };
                    $("stop").disabled = false;
                    await readFrames(response.body, (frame) => showFrame(frame, reply));
                } finally {
                    state.turn = null;
                    $("stop").disabled = true;
                    setChatEnabled(state.threadId !== null);
                }
                if (analysisId === state.analysisId) await loadThreads();
            }

            // An EventSource cannot send the Authorization header, thus the page reads the SSE body of the POST itself.
            async function readFrames(body, onFrame) {
                const reader = body.pipeThrough(new TextDecoderStream()).getReader();
                let buffer = "";
                for (;;) {
                    const { value, done } = await reader.read();
                    if (done) return;
                    buffer += value;
                    for (let end = buffer.indexOf("\n\n"); end !== -1; end = buffer.indexOf("\n\n")) {
                        const event = buffer.slice(0, end);
                        buffer = buffer.slice(end + 2);
                        // The `: open` and `: ping` comments carry no data line.
                        for (const line of event.split("\n")) if (line.startsWith("data: ")) onFrame(JSON.parse(line.slice("data: ".length)));
                    }
                }
            }

            function showFrame(frame, reply) {
                if (frame.type === "text-delta") reply.textContent += frame.text;
                else if (frame.type === "tool-started") reply.textContent += `\n[tool ${frame.name}]\n`;
                else if (frame.type === "error") $("error").textContent = frame.message;
            }

            $("stop").onclick = () =>
                guard(async () => {
                    const turn = state.turn;
                    if (turn === null) return;
                    await api("POST", `/analyses/${turn.analysisId}/threads/${turn.threadId}/turns/${turn.turnId}/abort`);
                });

            if (token === null) $("error").textContent = "No token in the URL. Open the URL that `bun scripts/poc_gui.ts` prints.";
            else guard(loadAnalyses);
        </script>
    </body>
</html>
