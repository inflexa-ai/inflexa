id: M-0036
label: "Pathway activity with decoupleR mlm on the PROGENy footprint model"
edam_operation: EDAM:operation_3501
description: >-
  A footprint score per signaling pathway from the PROGENy model: each
  pathway is a weighted set of the genes that respond to a perturbation of
  the pathway, learned from public perturbation experiments. The multivariate
  linear model (mlm) of decoupleR regresses the gene-level statistic of a
  contrast, or the log expression of one sample, on the weights of the top
  responsive genes of every pathway at once. The score reads as the
  transcriptional footprint of the pathway, not as the expression of its
  members. The univariate model (ulm) is the second estimator.
packages:
  - name: decoupleR
    track: bioconductor
    biotools: decoupler
    version_range: ">=2.10"
    bioconductor: "3.23"
  - name: DESeq2
    track: bioconductor
    biotools: deseq2
    version_range: ">=1.50"
    bioconductor: "3.23"
  - name: decoupler
    track: python
    version_range: ">=2.0"
templates:
  - tpl-progeny-pathway-activity
  - tpl-decoupler-py-pathway-activity
