id: tpl-edger-ql
version: 1.0.0
label: "edgeR quasi-likelihood F-test, two-group differential expression"
language: R
method: M-0003
step_types: [filter_low_counts, normalize, model_design, differential_expression, multiple_testing]
edam_operations: [EDAM:operation_3223]
citations: [S-0003, S-0004, S-0005, S-0019, S-0041]
license: Apache-2.0
applicability:
  modality: bulk_rna_seq
  count_sources: [salmon, kallisto, star_featurecounts, rsem, unknown]
  design_patterns: [two_group_unpaired, two_group_with_balanced_batch, two_group_with_covariates]
  min_replicates: 2
  notes: >-
    A count matrix whose first column is the gene identifier and whose header
    holds the sample identifiers, plus a sample table with one row per sample.
    The condition column is renamed to `condition` inside the script, thus the
    design formula names `condition` and any other column of the sample table
    by its own name. One contrast: the test level against the reference level,
    as the coefficient of `condition` in the design matrix. The filter uses
    the group sizes, the normalization is TMM, and the test is the
    quasi-likelihood F-test of edgeR 4.
parameters:
  - name: counts_path
    type: string
    description: "Path of the count matrix CSV, first column gene id, header sample ids, integer counts."
    adaptable: true
  - name: metadata_path
    type: string
    description: "Path of the sample table CSV with one row per sample."
    adaptable: true
  - name: sample_id_column
    type: string
    description: "The column of the sample table that holds the sample identifiers that match the count matrix header."
    adaptable: true
    default: sample
  - name: condition_column
    type: string
    description: "The column of the sample table that holds the condition of interest."
    adaptable: true
  - name: reference_level
    type: string
    description: "The level of the condition that is the denominator of the fold change, for example Control."
    adaptable: true
  - name: test_level
    type: string
    description: "The level of the condition that is the numerator of the fold change, for example Treated."
    adaptable: true
  - name: design
    type: formula
    description: "The design formula. It must end with condition. Put a balanced batch or a covariate before it, for example ~ batch + condition."
    adaptable: true
    default: "~ condition"
    default_source: "doi:10.12688/f1000research.27893.1"
    pattern: "condition\\s*$"
  - name: min_count
    type: integer
    description: "The min.count of filterByExpr: a gene stays when it has at least this many counts, on the CPM scale of the median library, in the smallest group."
    adaptable: true
    default: 10
    default_source: "guide:edgeR/2026-04-25#filtering"
    minimum: 0
  - name: min_total_count
    type: integer
    description: "The min.total.count of filterByExpr: a gene stays only when its total count over all samples is at least this many."
    adaptable: true
    default: 15
    default_source: "guide:edgeR/2026-04-25#filtering"
    minimum: 0
  - name: normalization_method
    type: string
    description: "The method of calcNormFactors. TMM is the default of edgeR. TMMwsp is for many zero counts. none keeps the library sizes only."
    adaptable: true
    default: TMM
    default_source: "guide:edgeR/2026-04-25#normalization"
    enum: [TMM, TMMwsp, RLE, upperquartile, none]
  - name: robust
    type: boolean
    description: "The robust option of glmQLFit: robust estimation of the quasi-likelihood dispersion prior against outlier genes."
    adaptable: false
    default: true
    default_source: "guide:edgeR/2026-04-25#quasi-likelihood"
  - name: alpha
    type: number
    description: "The FDR cutoff (Benjamini-Hochberg) that counts a gene as significant in the summary and the figures."
    adaptable: false
    default: 0.05
    default_source: "doi:10.1111/j.2517-6161.1995.tb02031.x"
  - name: n_top_genes_mds
    type: integer
    description: "The number of most variable genes for the MDS plot."
    adaptable: true
    default: 500
    default_source: "guide:edgeR/2026-04-25#data-exploration"
    minimum: 50
  - name: output_prefix
    type: string
    description: "The prefix of the output files, for example de or lesional_vs_control."
    adaptable: true
    default: de
    pattern: "^[A-Za-z0-9_.-]+$"
inputs:
  - name: counts
    path: "{{counts_path}}"
    format: EDAM:format_3752
    description: "Gene by sample raw integer counts, CSV."
  - name: metadata
    path: "{{metadata_path}}"
    format: EDAM:format_3752
    description: "Sample table, CSV."
outputs:
  - name: results
    path: "output/{prefix}_results.csv"
    format: EDAM:format_3752
    description: "One row per tested gene: gene, log2_fold_change, log_cpm, f_stat, pvalue, adjusted_pvalue (FDR, Benjamini-Hochberg)."
  - name: normalized_cpm
    path: "output/{prefix}_normalized_cpm.csv"
    format: EDAM:format_3752
    description: "Counts per million on the TMM-normalized library sizes, genes by samples."
  - name: summary
    path: "output/{prefix}_summary.json"
    format: EDAM:format_3464
    description: "The contrast, the counts of tested and significant genes, the thresholds, the normalization factors, the package versions."
  - name: mds
    path: "figures/{prefix}_mds.png"
    description: "MDS plot of the samples on the log-CPM of the top variable genes, colored by condition (and PDF)."
  - name: ma
    path: "figures/{prefix}_ma.png"
    description: "MA plot, log2 fold change against average log-CPM (and PDF)."
  - name: volcano
    path: "figures/{prefix}_volcano.png"
    description: "Volcano plot, log2 fold change against -log10 FDR (and PDF)."
  - name: session
    path: "output/session_info.txt"
    description: "R session information for the record."
environment:
  - name: edgeR
    version: "4.10.3"
    track: bioconductor
  - name: limma
    version: "3.68.5"
    track: bioconductor
  - name: ggplot2
    version: "4.0.3"
    track: cran
  - name: jsonlite
    version: "2.0.0"
    track: cran
bioconductor: "3.23"
body_file: body.R
tests:
  - name: two-group-n3
    dataset: two_group_n3/seed-1
    slots:
      counts_path: /work/data/counts.csv
      metadata_path: /work/data/metadata.csv
      condition_column: condition
      reference_level: control
      test_level: treated
    expect:
      - "exists output/de_results.csv"
      - "exists output/de_normalized_cpm.csv"
      - "exists output/de_summary.json"
      - "exists output/session_info.txt"
      - "exists figures/de_mds.png"
      - "exists figures/de_mds.pdf"
      - "exists figures/de_ma.png"
      - "exists figures/de_volcano.pdf"
      - "csv_rows output/de_results.csv >= 5000"
      - "truth_recall output/de_results.csv >= 0.2"
      - "truth_fdr output/de_results.csv <= 0.1"
  - name: two-group-n6
    dataset: two_group_n6/seed-1
    slots:
      counts_path: /work/data/counts.csv
      metadata_path: /work/data/metadata.csv
      condition_column: condition
      reference_level: control
      test_level: treated
      output_prefix: treated_vs_control
    expect:
      - "exists output/treated_vs_control_results.csv"
      - "exists output/treated_vs_control_summary.json"
      - "exists figures/treated_vs_control_mds.png"
      - "csv_rows output/treated_vs_control_results.csv >= 5000"
      - "truth_recall output/treated_vs_control_results.csv >= 0.45"
      - "truth_fdr output/treated_vs_control_results.csv <= 0.1"
