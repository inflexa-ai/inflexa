id: R-0108
title: "The ranking statistic of a preranked enrichment is a disputed choice that the plan states"
assertion: >-
  The ranking statistic of a preranked gene set enrichment is disputed. The
  Wald statistic, the signed negative log10 p-value, and the shrunken log2
  fold change each have a defensible case, and the survey literature finds
  that the metric changes the result. Choose one side, state the choice in
  the plan, and report the metric beside the gene set database and its
  version.
modality: bulk_rna_seq
conditions:
  - field: data_state
    op: in
    value: [counts, tpm_or_fpkm, log_normalized]
  - field: question
    op: in
    value: [enrichment, full_plan]
action:
  step_type: enrichment
  parameters:
    - name: rank_metric_choice
      value: stated_in_plan
      default_source: "rule:R-0108"
severity: info
strength: disputed
evidence_quality: moderate
recommendation_strength: conditional
disputed_sides:
  - label: "Wald statistic (stat column of DESeq2 results): signed and scaled by the standard error"
    method: M-0010
  - label: "Signed negative log10 p-value: sign(log2FC) times -log10(p)"
    method: M-0010
  - label: "Shrunken log2 fold change (apeglm): effect size, low-count noise removed"
    method: M-0010
evidence:
  - direction: supports
    eco: ECO:0000033
    cito: cito:supports
    source: S-0024
    paraphrase: >-
      GSEA uses the whole ranked list of genes and asks whether the members of
      a set concentrate at the top or the bottom, thus it needs no threshold on
      the individual genes.
    anchor: "Abstract; Overview of GSEA"
    retrieved: "2026-09-03"
  - direction: supports
    eco: ECO:0000033
    cito: cito:usesMethodIn
    source: S-0025
    paraphrase: >-
      fgsea computes the same preranked enrichment statistic with an adaptive
      multilevel permutation scheme that gives accurate low p-values in seconds.
    anchor: "Abstract; Methods"
    retrieved: "2026-09-03"
  - direction: supports
    eco: ECO:0000033
    cito: cito:supports
    source: S-0026
    paraphrase: >-
      The protocol recommends a ranking that carries both direction and
      significance, for example a signed test statistic or a signed
      -log10 p-value, and it warns that a ranking by p-value alone drops the
      direction.
    anchor: "Procedure, Step 2: Rank the gene list"
    retrieved: "2026-09-03"
  - direction: disputes
    eco: ECO:0000033
    cito: cito:disagreesWith
    source: S-0027
    paraphrase: >-
      The survey finds that the ranking metric, the gene set database version,
      and the background are inconsistently reported and that each changes the
      result, thus no single ranking is a settled standard and the choice must
      be stated.
    anchor: "Results; Recommendations"
    retrieved: "2026-09-03"
status: active
license: CC-BY-4.0
curator: "radu@geneguard.bio"
llm_drafted: true
drafting_model: "claude-fable-5-1"
curated: "2026-09-05"
tags: [enrichment, gsea, disputed]
