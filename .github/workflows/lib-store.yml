name: Store Pipeline

# TEMPORARY, remove before merge: the branch-side driver of the three store
# workflows. GitHub creates runs only for workflows that its registry
# knows, and this branch cannot register a new file. The lib-store.yml
# PATH is registered from main, and a dispatch with --ref runs the file of
# the given ref at that path. Thus the pipeline lives in this slot on the
# branch, and the called workflows run INSIDE its run, in a strict
# sequence on the shared builders.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    uses: ./.github/workflows/sandbox-images-build.yml
    secrets: inherit
