name: Package Store Pipeline

# The one-dispatch driver of the full store publication: the sandbox images,
# then the package store, then the acceptance. The three called workflows run
# INSIDE this run, in a strict sequence on the shared builders, thus one
# dispatch replaces three manual ones and no pair races for a builder box.
# Each stage also keeps its own workflow_dispatch, for a re-run of one stage
# alone. Start the builders first (`just build-start [arch]`).

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    uses: ./.github/workflows/sandbox-images-build.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  store:
    needs: images
    uses: ./.github/workflows/package-store-build.yml
    secrets: inherit
    permissions:
      # The lock commit-back job of the store build writes to the branch.
      contents: write
      packages: write

  acceptance:
    needs: store
    uses: ./.github/workflows/package-store-acceptance.yml
    secrets: inherit
    permissions:
      contents: read
      packages: read
      actions: read
