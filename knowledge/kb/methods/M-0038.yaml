id: M-0038
label: "Transcription factor activity with decoupleR on the DoRothEA regulons of confidence A to C"
edam_operation: EDAM:operation_3501
description: >-
  The same univariate or multivariate linear model of decoupleR, on the
  DoRothEA regulons instead of CollecTRI. DoRothEA gives each regulator to
  target interaction a confidence level from A (curated and supported by
  several evidence types) to E (a single computational prediction), and the
  analysis keeps the levels A to C. The alternative regulon set for a
  comparison with a published DoRothEA result, or for a reader who asks for
  the confidence levels of the interactions.
packages:
  - name: decoupleR
    track: bioconductor
    biotools: decoupler
    version_range: ">=2.10"
    bioconductor: "3.23"
  - name: dorothea
    track: bioconductor
    version_range: ">=1.14"
    bioconductor: "3.23"
  - name: decoupler
    track: python
    version_range: ">=2.0"
