id: M-0053
label: "Cox proportional hazards model on a per-sample score with clinical covariates"
description: >-
  A Cox proportional hazards regression of the time to event on a per-sample
  expression score or a gene, with the clinical covariates in the same model.
  The score enters as a continuous term, the proportional hazards assumption
  is checked on the scaled Schoenfeld residuals, and the hazard ratio is
  reported with its confidence interval. survminer draws the survival curves
  and the diagnostic plots.
packages:
  - name: survival
    track: cran
    version_range: ">=3.5"
  - name: survminer
    track: cran
    version_range: ">=0.4"
  - name: edgeR
    track: bioconductor
    biotools: edger
    version_range: ">=4.0"
    bioconductor: "3.23"
  - name: jsonlite
    track: cran
    version_range: ">=1.8"
  - name: lifelines
    track: python
    version_range: ">=0.28"
  - name: decoupler
    track: python
    version_range: ">=2.2"
templates:
  - tpl-survival-cox
  - tpl-lifelines-cox
