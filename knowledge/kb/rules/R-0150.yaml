id: R-0150
title: "Aberrant expression in one sample of a cohort: OUTRIDER is the tool of record and is absent here, and a z-score on the variance-stabilized counts with a stated threshold is the substitute"
assertion: >-
  For a cohort without groups, where the question is which gene is aberrant
  in which sample, as in a rare disease diagnostic, the tool of record is
  OUTRIDER: an autoencoder controls the hidden confounders, and a negative
  binomial test per gene and per sample gives a calibrated p-value. OUTRIDER
  is absent from this pool. Do not name it as the executable step. The
  substitute is descriptive: apply the variance stabilizing transformation
  to the counts, center and scale each gene by the other samples of the
  cohort, and report each gene with an absolute z-score above a stated
  threshold in one sample as an outlier candidate of that sample. State in
  the plan that the z-score does not control a hidden confounder and gives
  no p-value, thus a candidate is a lead, and a diagnostic claim needs
  OUTRIDER on a cohort of enough samples.
modality: bulk_rna_seq
conditions:
  - field: question
    op: eq
    value: qc
  - field: n_groups
    op: eq
    value: 1
  - field: data_state
    op: eq
    value: counts
action:
  step_type: qc_sample_structure
  parameters:
    - name: aberrant_expression_tool_of_record
      value: OUTRIDER_absent_from_pool
      default_source: "doi:10.1016/j.ajhg.2018.10.025"
    - name: aberrant_expression_substitute
      value: vst_z_score_per_gene_per_sample
      default_source: "rule:R-0150"
    - name: z_score_threshold
      value: 3
      default_source: "rule:R-0150"
severity: info
strength: common_practice
evidence_quality: moderate
recommendation_strength: conditional
evidence:
  - direction: supports
    eco: ECO:0000033
    cito: cito:citesAsAuthority
    source: S-0130
    paraphrase: >-
      OUTRIDER finds a gene with an aberrant expression in one sample of a
      cohort. It fits an autoencoder to the counts to model the hidden
      confounders, then it tests each gene in each sample against a negative
      binomial distribution with the fitted expectation and dispersion, and
      it returns a p-value per gene and per sample. The paper states that
      the earlier methods either give no significance assessment, so a
      cutoff is arbitrary, or rest on a manual correction of the
      confounders. Its precision-recall analysis on simulated outliers shows
      the value of the confounder control and of a significance threshold,
      and it presents the method for rare disease diagnostic platforms.
