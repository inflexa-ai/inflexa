id: R-0107
title: "Ranked gene set enrichment on the full tested list is the default enrichment method"
assertion: >-
  For enrichment after a differential expression test, rank every tested gene
  and run a preranked gene set enrichment analysis (fgsea) against the MSigDB
  Hallmark collection, with Benjamini-Hochberg adjustment. The full ranked
  list is the default input, because a threshold on the individual genes
  drops the weak but coherent signal of a set. An over-representation test is
  the method for a discrete gene list, and camera is the method when the
  correlation among the genes of a set must be accounted for. The ranking
  statistic is a stated choice, see the companion rule on the dispute.
modality: bulk_rna_seq
conditions:
  - field: data_state
    op: in
    value: [counts, tpm_or_fpkm, log_normalized]
  - field: question
    op: in
    value: [enrichment, full_plan]
action:
  step_type: enrichment
  method: M-0010
  parameters:
    - name: rank_metric
      value: stat
      default_source: "doi:10.1101/060012"
    - name: enrichment_input_default
      value: ranked_list
      default_source: "doi:10.1073/pnas.0506580102"
severity: info
strength: consensus
evidence_quality: moderate
recommendation_strength: strong
alternatives:
  - method: M-0011
    when: "The question is about a discrete gene list, for example the genes below an adjusted p-value cutoff. Set enrichment_input to gene_list in the situation."
  - method: M-0021
    when: "Inter-gene correlation within a set must be accounted for; camera on the limma fit is the competitive test that does so."
evidence:
  - direction: supports
    eco: ECO:0000033
    cito: cito:supports
    source: S-0024
    paraphrase: >-
      GSEA uses the whole ranked list of genes and asks whether the members of
      a set concentrate at the top or the bottom, thus it needs no threshold on
      the individual genes.
    anchor: "Abstract; Overview of GSEA"
    retrieved: "2026-09-03"
  - direction: supports
    eco: ECO:0000033
    cito: cito:usesMethodIn
    source: S-0025
    paraphrase: >-
      fgsea computes the same preranked enrichment statistic with an adaptive
      multilevel permutation scheme that gives accurate low p-values in seconds.
    anchor: "Abstract; Methods"
    retrieved: "2026-09-03"
  - direction: supports
    eco: ECO:0000033
    cito: cito:supports
    source: S-0026
    paraphrase: >-
      The protocol recommends a ranking that carries both direction and
      significance, for example a signed test statistic or a signed
      -log10 p-value, and it warns that a ranking by p-value alone drops the
      direction.
    anchor: "Procedure, Step 2: Rank the gene list"
    retrieved: "2026-09-03"
  - direction: disputes
    eco: ECO:0000033
    cito: cito:disagreesWith
    source: S-0027
    paraphrase: >-
      The survey finds that the ranking metric, the gene set database version,
      and the background are inconsistently reported and that each changes the
      result, thus no single ranking is a settled standard and the choice must
      be stated.
    anchor: "Results; Recommendations"
    retrieved: "2026-09-03"
status: active
license: CC-BY-4.0
curator: "radu@geneguard.bio"
llm_drafted: true
drafting_model: "claude-fable-5-1"
curated: "2026-09-05"
tags: [enrichment, gsea, default]
