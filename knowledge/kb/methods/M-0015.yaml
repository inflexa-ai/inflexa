id: M-0015
label: "Descriptive log fold changes only, no inferential test"
description: >-
  Normalized counts and a log2 fold change per gene with no p-value, because
  the design has no within-group replication and no dispersion can be estimated.
packages:
  - name: DESeq2
    track: bioconductor
    biotools: deseq2
    version_range: ">=1.50"
    bioconductor: "3.23"
templates:
  - tpl-descriptive-no-replicates
