id: M-0041
label: "MCP-counter abundance scores of immune and stromal populations"
edam_operation: EDAM:operation_3629
description: >-
  A marker-based abundance score for eight immune populations and two stromal
  populations from the log2 expression of population-specific marker genes.
  Each score is comparable between samples for one population and not
  comparable between populations. The input is a log2 normalized expression
  matrix, log2 TPM or log2 CPM, of human samples. The package installs from
  its GitHub repository, thus the track here is the nearest R track.
packages:
  - name: MCPcounter
    track: cran
    version_range: ">=1.2"
  - name: immunedeconv
    track: cran
    version_range: ">=2.1"
  - name: xCell
    track: cran
    version_range: ">=1.1"
  - name: EPIC
    track: cran
    version_range: ">=1.1"
  - name: quantiseqr
    track: bioconductor
    version_range: ">=1.10"
    bioconductor: "3.23"
  - name: babelgene
    track: cran
    version_range: ">=22.9"
templates:
  - tpl-immunedeconv
