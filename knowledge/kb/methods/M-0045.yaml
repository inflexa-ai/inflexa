id: M-0045
label: "UCell rank-based signature scores per sample"
edam_operation: EDAM:operation_3501
description: >-
  A per-sample signature score from the Mann-Whitney U statistic of the ranks
  of the signature genes within the sample. The score depends on the relative
  ranks only, thus it is robust to the sequencing depth and to the size of the
  matrix, and it needs no group label. The input is a normalized expression
  matrix, and a signature is a gene list with an optional sign per gene.
packages:
  - name: UCell
    track: bioconductor
    biotools: ucell
    version_range: ">=2.10"
    bioconductor: "3.23"
  - name: singscore
    track: bioconductor
    biotools: singscore
    version_range: ">=1.30"
    bioconductor: "3.23"
  - name: GSVA
    track: bioconductor
    biotools: gsva
    version_range: ">=2.0"
    bioconductor: "3.23"
  - name: edgeR
    track: bioconductor
    biotools: edger
    version_range: ">=4.0"
    bioconductor: "3.23"
  - name: limma
    track: bioconductor
    biotools: limma
    version_range: ">=3.60"
    bioconductor: "3.23"
templates:
  - tpl-signature-scoring
