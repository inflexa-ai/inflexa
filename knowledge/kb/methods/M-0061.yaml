id: M-0061
label: "mMCP-counter abundance scores of immune and stromal populations in mouse samples"
edam_operation: EDAM:operation_3629
description: >-
  The murine version of MCP-counter: a marker-based abundance score for
  sixteen immune and stromal populations from the log2 expression of
  population-specific marker genes selected on mouse samples. Each score is
  comparable between samples for one population and not comparable between
  populations. The input is a log2 normalized expression matrix of mouse
  samples with mouse gene symbols or Ensembl identifiers; no ortholog map to
  human is involved. immunedeconv runs it through deconvolute_mouse. The
  package installs from its GitHub repository, thus the track here is the
  nearest R track.
packages:
  - name: mMCPcounter
    track: cran
    version_range: ">=1.1"
  - name: immunedeconv
    track: cran
    version_range: ">=2.1"
templates:
  - tpl-immunedeconv
