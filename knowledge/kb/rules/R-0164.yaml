id: R-0164
title: "Human gene list: Disease Ontology over-representation with DOSE as a complement to GO, with the same universe rules"
assertion: >-
  For a discrete list of human genes, run a Disease Ontology
  over-representation with DOSE beside the Gene Ontology analysis. Use the
  same universe as the GO analysis, the tested genes and not the genome, and
  the same Entrez gene identifiers, and reduce the redundant terms by their
  semantic similarity before the report. The Disease Ontology is a human
  vocabulary, thus the analysis does not apply to a mouse list without an
  ortholog map. Report the release of the ontology and the size window of
  the term sets, and do not present a disease term as a diagnosis of the
  samples.
  The plan names the source of the disease gene sets: DOSE 4 downloads them
  at the first call, and a sandbox without network builds the same sets from
  the HDO.db package, each term with the genes of its offspring terms.
modality: bulk_rna_seq
conditions:
  - field: enrichment_input
    op: eq
    value: gene_list
  - field: organism
    op: eq
    value: human
action:
  step_type: enrichment
  method: M-0058
  parameters:
    - name: disease_ontology_ora
      value: enrichDO_same_universe_as_go
      default_source: "doi:10.1093/bioinformatics/btu684"
    - name: disease_gene_sets
      value: HDO.db_terms_with_the_genes_of_their_offspring
      default_source: "doi:10.1093/bioinformatics/btu684"
      required: true
severity: info
strength: common_practice
evidence_quality: moderate
recommendation_strength: conditional
