id: R-0151
title: "The report of a co-expression analysis states the sample count, the soft threshold and its fit, the modules with their sizes, the gene-to-module table, and the eigengene-trait correlations with their adjusted p-values"
assertion: >-
  The report of a co-expression analysis carries the elements that let a
  reader judge each module. State the number of samples and the number of
  genes that entered the network, the network type, the soft-threshold
  power with the scale-free fit index and the mean connectivity at that
  power, and the module detection parameters. List each module with its
  size and its color label, and give the full gene-to-module table with the
  module membership of each gene. Give the correlation of each module
  eigengene with each trait, the p-value, and the p-value adjusted across
  the modules and the traits, because the number of tests is the product
  of the two counts. State that a module is a group of correlated genes and
  not a proven pathway, and that a module-trait correlation is an
  association in this cohort.
modality: bulk_rna_seq
conditions:
  - field: question
    op: eq
    value: coexpression
action:
