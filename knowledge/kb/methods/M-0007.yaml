id: M-0007
label: "Low count filter: keep a gene with at least 10 counts in at least the smallest group size of samples"
description: >-
  A pre-filter that removes genes with almost no counts before the model. It
  reduces the multiple testing burden and the memory, and it keeps a gene that
  is expressed in one whole group.
packages:
  - name: DESeq2
    track: bioconductor
    biotools: deseq2
    version_range: ">=1.50"
    bioconductor: "3.23"
templates:
  - tpl-deseq2-two-group
  - tpl-deseq2-blocked
  - tpl-deseq2-interaction
  - tpl-deseq2-lrt-timecourse
  - tpl-pydeseq2-two-group
