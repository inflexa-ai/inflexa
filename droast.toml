# The two sandbox Dockerfiles are built with the repository root as their
# context, so the root .dockerignore is the effective ignore file. droast
# covers both: the runtime image (sandbox-base) and the network-enabled
# builder (sandbox-provisioner).
[[overrides]]
paths = [
  "images/sandbox-base/Dockerfile",
  "images/sandbox-provisioner/Dockerfile",
]
skip = ["DF033"]

# wget is intentionally installed as an agent-facing runtime utility. Droast
# mistakes the apt package name for a second downloader invocation.
[[overrides]]
paths = ["images/sandbox-base/Dockerfile"]
skip = ["DF058"]

# The runtime stage appends to PATH inherited from the base image. Docker
# expands the old value before applying the ENV assignment; droast treats
# that as self-reference.
[[overrides]]
paths = ["images/sandbox-base/Dockerfile"]
skip = ["DF062"]
