id: R-0065
title: "RSEM quantifications: import the expected counts and the effective lengths with tximport, the type rsem path"
assertion: >-
  If the counts come from RSEM, import the gene results files with tximport
  and the type rsem. RSEM gives an expected count per gene, which is not an
  integer, and an effective length per gene and sample. tximport carries the
  expected counts and the effective lengths into the count model, and the
  model uses the lengths as an offset. Do not round the expected counts by
  hand, and do not use the TPM column as the count. If a gene has an
  effective length of zero in a sample, set the length to one before the
  offset, as the tximport documentation describes.
modality: bulk_rna_seq
conditions:
  - field: count_source
    op: eq
    value: rsem
  - field: data_state
    op: eq
    value: counts
action:
  step_type: model_design
  parameters:
    - name: import
      value: tximport_rsem_expected_counts_with_effective_lengths
      default_source: "vignette:tximport/2026-04-28#rsem"
    - name: import_tool
      value: tximport
      default_source: "vignette:tximport/2026-04-28#rsem"
    - name: tximport_type
      value: rsem
      default_source: "vignette:tximport/2026-04-28#rsem"
severity: info
strength: consensus
evidence_quality: high
recommendation_strength: strong
evidence:
  - direction: supports
    eco: ECO:0000033
    cito: cito:usesMethodIn
    source: S-0049
    paraphrase: >-
      RSEM estimates the abundance of each transcript and gene with an
      expectation-maximization model, and it reports an expected count per
      transcript and per gene, where the expected count is a sum of
      fractional read assignments, beside the effective length that the
      model uses.
    anchor: "Abstract; Methods"
    retrieved: "2026-09-05"
  - direction: supports
    eco: ECO:0000033
    cito: cito:usesMethodIn
    source: S-0010
    paraphrase: >-
      The vignette imports RSEM gene results with the type rsem and the
      gene-level flag, carries the expected counts and the effective lengths
      into DESeq2 and edgeR, and notes that a gene with an effective length
      of zero must get a length of one before the import continues.
    anchor: "RSEM; Downstream DGE in Bioconductor"
    retrieved: "2026-09-05"
status: active
