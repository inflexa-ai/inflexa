evidence:
  - direction: supports
    eco: ECO:0000033
    cito: cito:usesMethodIn
    source: S-0099
    paraphrase: >-
      xCell learns gene signatures for 64 cell types from many pure cell
      profiles, scores each signature per sample with a rank-based
      enrichment score, and then applies a spillover compensation that
      removes the part of a score that comes from a related cell type. xCell
      is a gene-signature-based method, thus a score is a signature
      enrichment and not a fraction of the cells.
    anchor: "Abstract; Results, Spillover compensation; Methods, xCell score"
    retrieved: "2026-09-06"
  - direction: neutral
    eco: ECO:0000033
    cito: cito:discusses
    source: S-0102
    paraphrase: >-
      The benchmark classes xCell as a marker-based method whose scores permit
      a between-sample comparison only, and it measures the spillover between
      related cell types for every method that it covers.
    anchor: "Results, Spillover; Table 1; Guidelines"
    retrieved: "2026-09-06"
