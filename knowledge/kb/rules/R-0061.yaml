id: R-0061
title: "Multiple contrasts: adjust the p-values within each contrast, and report the contrast beside every adjusted p-value"
assertion: >-
  With three or more groups, the analysis tests more than one contrast.
  Adjust the p-values with the Benjamini-Hochberg procedure within each
  contrast, and state that the false discovery rate holds per contrast, not
  across the set of contrasts. Report the contrast name beside every adjusted
  p-value and every gene list, because a gene list without its contrast has
  no meaning. If the question asks for one gene list across all the
  contrasts, use the global adjustment across the contrasts, and state the
  choice in the plan.
modality: bulk_rna_seq
conditions:
  - field: data_state
    op: in
    value: [counts, tpm_or_fpkm, log_normalized]
  - field: n_groups
    op: gte
    value: 3
action:
  step_type: multiple_testing
  parameters:
    - name: adjustment_scope
      value: within_contrast
      default_source: "guide:limma/2026-05-19#multiple-testing-across-contrasts"
    - name: contrast_label_in_report
      value: true
      default_source: "vignette:DESeq2/1.52.0#contrasts"
severity: info
strength: consensus
evidence_quality: high
recommendation_strength: strong
evidence:
  - direction: supports
    eco: ECO:0000033
    cito: cito:usesMethodIn
    source: S-0008
    paraphrase: >-
      The guide states that the default of decideTests adjusts the p-values
      of each contrast separately, that the global method adjusts across all
      the contrasts at once, and that the two methods control the false
      discovery rate in different families of tests.
    anchor: "Multiple Testing Across Contrasts"
    retrieved: "2026-09-05"
  - direction: supports
    eco: ECO:0000033
    cito: cito:usesMethodIn
    source: S-0002
    paraphrase: >-
      The vignette extracts one results table per contrast, and each table
      holds its own adjusted p-values from the Benjamini-Hochberg procedure
      and its own independent filtering threshold.
    anchor: "Contrasts; Independent filtering and multiple testing"
    retrieved: "2026-09-05"
  - direction: neutral
    eco: ECO:0000033
    cito: cito:discusses
    source: S-0069
    paraphrase: >-
      The guide explains that a false discovery rate method controls the
      expected share of false discoveries among the rejected hypotheses of
      one set of tests, thus the set of tests to which the method applies
      decides what the rate means.
    anchor: "Background; Methods"
    retrieved: "2026-09-05"
status: active
