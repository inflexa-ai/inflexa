id: R-0155
title: "A classifier of a sample class from expression: penalized logistic regression with nested cross-validation and a ROC with its confidence interval"
assertion: >-
  To classify a sample into one of two or more classes from its expression,
  fit a penalized logistic regression with glmnet on the log-scale expression
  of the tested genes. Never estimate the performance on the samples that
  trained the model. Select the lambda in an inner cross-validation and
  measure the performance in an outer cross-validation, thus each prediction
  comes from a model that did not see that sample. Report the ROC curve and
  the area under it with a confidence interval from the outer predictions,
  and report the genes with a nonzero coefficient. With few samples per
  class, state that the interval is wide and that the gene set is unstable
  across folds. A per-sample signature score is a different task, and this
  rule applies only when the question is a classifier of the samples.
modality: bulk_rna_seq
conditions:
  - field: data_state
    op: in
    value: [counts, tpm_or_fpkm, log_normalized]
action:
  step_type: signature_scoring
  parameters:
    - name: classifier_model
      value: penalized_logistic_regression
      default_source: "doi:10.18637/jss.v033.i01"
    - name: classifier_validation
      value: nested_cross_validation
      default_source: "rule:R-0155"
    - name: classifier_performance
      value: roc_auc_with_confidence_interval
      default_source: "doi:10.1186/1471-2105-12-77"
