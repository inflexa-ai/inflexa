id: tpl-dream-repeated
version: 1.0.0
label: "dream mixed model with voom weights for a random subject effect (variancePartition)"
language: R
method: M-0017
step_types: [filter_low_counts, normalize, model_design, differential_expression, multiple_testing]
edam_operations: [EDAM:operation_3223]
citations: [S-0004, S-0006, S-0007, S-0019, S-0041, S-0042, S-0089]
license: Apache-2.0
applicability:
  modality: bulk_rna_seq
  count_sources: [salmon, kallisto, star_featurecounts, rsem, unknown]
  design_patterns: [repeated_measures, two_group_paired, two_group_with_blocking_factor]
  min_replicates: 2
  conditions:
    - field: paired
      op: eq
      value: true
  notes: >-
    A count matrix whose first column is the gene identifier and whose header
    holds the sample identifiers, plus a sample table with one row per sample.
    The sample table holds a subject column, for example the subject, the
    donor, or the mouse, and a condition column. The script renames the
    subject column to `subject` and the condition column to `condition`. The
    design formula names the fixed effects only, and it ends with condition.
    The script adds the random intercept `(1 | subject)` to the design, thus
    the mixed model fits one variance for the subject per gene. A fixed
    subject term is not permitted in the design. At least one subject must
    give two or more samples. One contrast: test level against reference
    level. The mixed model fits one model per gene in a serial loop, thus the
    run takes minutes on ten thousand genes.
parameters:
  - name: counts_path
    type: string
    description: "Path of the count matrix CSV, first column gene id, header sample ids, integer counts."
    adaptable: true
  - name: metadata_path
    type: string
    description: "Path of the sample table CSV with one row per sample."
    adaptable: true
  - name: sample_id_column
    type: string
    description: "The column of the sample table that holds the sample identifiers that match the count matrix header."
    adaptable: true
    default: sample
  - name: condition_column
    type: string
    description: "The column of the sample table that holds the condition of interest."
    adaptable: true
  - name: subject_column
    type: string
    description: "The column of the sample table that holds the subject, for example subject, donor, or mouse. Samples that share a value come from one subject. The subject is a random effect, thus it must not appear in the design."
    adaptable: true
  - name: reference_level
    type: string
    description: "The level of the condition that is the denominator of the fold change, for example Control."
    adaptable: true
  - name: test_level
    type: string
    description: "The level of the condition that is the numerator of the fold change, for example Treated."
    adaptable: true
  - name: design
    type: formula
    description: "The design formula of the fixed effects. It must end with condition and must not name the subject. Put a covariate before it, for example ~ time + condition. The script adds the random intercept (1 | subject)."
    adaptable: true
    default: "~ condition"
    default_source: "doi:10.1093/bioinformatics/btaa687"
    pattern: "condition\\s*$"
  - name: min_count
    type: integer
    description: "The min.count of filterByExpr: a gene stays when it has at least this many counts, on the CPM scale of the median library, in the smallest group."
    adaptable: true
    default: 10
    default_source: "doi:10.12688/f1000research.9005.3"
    minimum: 0
  - name: min_total_count
    type: integer
    description: "The min.total.count of filterByExpr: a gene also needs at least this many counts over all samples."
    adaptable: true
    default: 15
    default_source: "doi:10.12688/f1000research.9005.3"
    minimum: 0
  - name: normalization_method
    type: string
    description: "The library size scaling method of normLibSizes."
    adaptable: true
    default: TMM
    default_source: "doi:10.12688/f1000research.9005.3"
    enum: [TMM, TMMwsp, RLE, upperquartile, none]
  - name: ddf
    type: string
    description: "The method of dream for the degrees of freedom of the mixed model test. Kenward-Roger is more accurate on a small dataset but much slower, and it needs reml true."
    adaptable: true
    default: Satterthwaite
    default_source: "vignette:variancePartition/1.42.0#rnd_effects"
    enum: [Satterthwaite, Kenward-Roger]
  - name: reml
    type: boolean
    description: "true fits the mixed model by restricted maximum likelihood, false by maximum likelihood. Kenward-Roger needs true. With Satterthwaite, false gives more power on a small number of subjects."
    adaptable: true
    default: false
    default_source: "vignette:variancePartition/1.42.0#rnd_effects"
  - name: alpha
    type: number
    description: "The adjusted p-value cutoff that counts a gene as significant in the summary and the figures."
    adaptable: false
    default: 0.05
    default_source: "guide:limma/2026-05-19#multiple-testing-across-genes-and-contrasts"
  - name: n_top_genes_mds
    type: integer
    description: "The number of most variable genes for the MDS plot."
    adaptable: true
    default: 500
    default_source: "doi:10.12688/f1000research.9005.3"
    minimum: 50
  - name: output_prefix
    type: string
    description: "The prefix of the output files, for example de or treated_vs_control."
    adaptable: true
    default: de
    pattern: "^[A-Za-z0-9_.-]+$"
inputs:
  - name: counts
    path: "{{counts_path}}"
    format: EDAM:format_3752
    description: "Gene by sample raw integer counts, CSV."
  - name: metadata
    path: "{{metadata_path}}"
    format: EDAM:format_3752
    description: "Sample table, CSV, with the condition column and the subject column."
outputs:
  - name: results
    path: "output/{prefix}_results.csv"
    format: EDAM:format_3752
    description: "One row per tested gene: gene, log_cpm_mean (mean log2 CPM), log2_fold_change, t_stat (moderated t), pvalue, adjusted_pvalue (BH)."
  - name: logcpm
    path: "output/{prefix}_logcpm.csv"
    format: EDAM:format_3752
    description: "voom log2 CPM values after the library size scaling, genes by samples, for downstream visualization."
  - name: summary
    path: "output/{prefix}_summary.json"
    format: EDAM:format_3464
    description: "The contrast, the formula with the random effect, the subject column, the counts of tested and significant genes, the thresholds, the package versions."
  - name: voom_trend
    path: "figures/{prefix}_voom_trend.png"
    description: "The voom mean-variance trend under the mixed model: sqrt standard deviation against mean log2 count, with the lowess line (and PDF)."
  - name: mds
    path: "figures/{prefix}_mds.png"
    description: "MDS plot of the samples on the top variable genes, colored by condition, shaped by subject (and PDF)."
  - name: volcano
    path: "figures/{prefix}_volcano.png"
    description: "Volcano plot, log2 fold change against -log10 adjusted p-value (and PDF)."
  - name: session
    path: "output/session_info.txt"
    description: "R session information for the record."
environment:
  - name: variancePartition
    version: "1.42.0"
    track: bioconductor
  - name: limma
    version: "3.68.5"
    track: bioconductor
  - name: edgeR
    version: "4.10.3"
    track: bioconductor
  - name: BiocParallel
    version: "1.46.0"
    track: bioconductor
  - name: ggplot2
    version: "4.0.3"
    track: cran
  - name: jsonlite
    version: "2.0.0"
    track: cran
bioconductor: "3.23"
body_file: body.R
tests:
  - name: paired-n5
    dataset: paired_n5/seed-1
    slots:
      counts_path: /work/data/counts.csv
      metadata_path: /work/data/metadata.csv
      condition_column: condition
      subject_column: subject
      reference_level: control
      test_level: treated
    expect:
      - "exists output/de_results.csv"
      - "exists output/de_logcpm.csv"
      - "exists output/de_summary.json"
      - "exists output/session_info.txt"
      - "exists figures/de_voom_trend.png"
      - "exists figures/de_voom_trend.pdf"
      - "exists figures/de_mds.png"
      - "exists figures/de_mds.pdf"
      - "exists figures/de_volcano.png"
      - "exists figures/de_volcano.pdf"
      - "csv_rows output/de_results.csv >= 5000"
      - "json output/de_summary.json n_subjects == 5"
      - "json output/de_summary.json n_samples == 10"
      - "truth_recall output/de_results.csv >= 0.4"
      - "truth_fdr output/de_results.csv <= 0.1"
