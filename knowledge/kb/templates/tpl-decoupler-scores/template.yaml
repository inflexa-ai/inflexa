id: tpl-decoupler-scores
version: 1.0.0
label: "decoupler ulm per-sample pathway scores on log-CPM with a t-test on the score matrix"
language: python
method: M-0034
step_types: [enrichment]
edam_operations: [EDAM:operation_3501]
citations: [S-0004, S-0041, S-0024, S-0031]
license: Apache-2.0
applicability:
  modality: bulk_rna_seq
  count_sources: [salmon, kallisto, star_featurecounts, rsem, unknown]
  design_patterns: [two_group_unpaired, two_group_with_balanced_batch, two_group_with_covariates, two_group_paired, two_group_with_blocking_factor]
  min_replicates: 3
  conditions:
    - field: interaction
      op: is_null
    - field: n_timepoints
      op: is_null
  notes: >-
    The Python mirror of tpl-gsva-hallmark. A count matrix whose first column
    is the gene identifier and whose header holds the sample identifiers, plus
    a sample table with one row per sample, plus a gene set collection in GMT
    format whose gene identifiers match the gene column. The script filters
    the genes with the decoupler filter_by_expr, which is adapted from
    filterByExpr of edgeR, and computes log2(CPM + 1) from the library sizes
    of the filtered counts, without a scaling factor. The GMT becomes a
    network data frame with one row per set and gene, and the decoupler
    univariate linear model (ulm) gives each gene set one score per sample:
    the t-value of the slope of the log-CPM values of a sample on the set
    membership. Then a two-sample t-test with a pooled variance compares the
    scores of the test level against the reference level per set, and
    Benjamini-Hochberg adjusts the p-values. The t-test has no design, thus a
    batch, a block, or a pair of the sample table does not enter the test.
    The condition column is renamed to `condition` inside the script. The
    score matrix keeps the file name of the R path, thus a reader compares the
    two paths file by file.
parameters:
  - name: counts_path
    type: string
    description: "Path of the count matrix CSV, first column gene id, header sample ids, integer counts."
    adaptable: true
  - name: metadata_path
    type: string
    description: "Path of the sample table CSV with one row per sample."
    adaptable: true
  - name: sample_id_column
    type: string
    description: "The column of the sample table that holds the sample identifiers that match the count matrix header."
    adaptable: true
    default: sample
  - name: condition_column
    type: string
    description: "The column of the sample table that holds the condition of interest."
    adaptable: true
  - name: reference_level
    type: string
    description: "The level of the condition that is the denominator of the score difference, for example Control."
    adaptable: true
  - name: test_level
    type: string
    description: "The level of the condition that is the numerator of the score difference, for example Treated."
    adaptable: true
  - name: gmt_path
    type: string
    description: "Path of the gene set collection in GMT format, one set per line: name, description, then the gene identifiers."
    adaptable: true
  - name: min_count
    type: integer
    description: "The min_count of filter_by_expr: a gene stays when it has at least this many counts, on the CPM scale of the median library, in the smallest group."
    adaptable: true
    default: 10
    default_source: "doi:10.12688/f1000research.9005.3"
    minimum: 0
  - name: min_total_count
    type: integer
    description: "The min_total_count of filter_by_expr: a gene also needs at least this many counts over all samples."
    adaptable: true
    default: 15
    default_source: "doi:10.12688/f1000research.9005.3"
    minimum: 0
  - name: min_size
    type: integer
    description: "A gene set enters the score when it has at least this many members among the filtered genes."
    adaptable: true
    default: 10
    default_source: "doi:10.1073/pnas.0506580102"
    minimum: 1
  - name: max_size
    type: integer
    description: "A gene set enters the score when it has at most this many members among the filtered genes."
    adaptable: true
    default: 500
    default_source: "doi:10.1073/pnas.0506580102"
    minimum: 1
  - name: n_top_sets
    type: integer
    description: "The number of gene sets on the heatmap and the bar plot, ordered by adjusted p-value."
    adaptable: true
    default: 50
    minimum: 5
  - name: output_prefix
    type: string
    description: "The prefix of the output files, for example gsva or hallmark_treated_vs_control. The default keeps the file names of the R path."
    adaptable: true
    default: gsva
    pattern: "^[A-Za-z0-9_.-]+$"
inputs:
  - name: counts
    path: "{{counts_path}}"
    format: EDAM:format_3752
    description: "Gene by sample raw integer counts, CSV."
  - name: metadata
    path: "{{metadata_path}}"
    format: EDAM:format_3752
    description: "Sample table, CSV."
  - name: gene_sets
    path: "{{gmt_path}}"
    description: "Gene set collection, GMT."
outputs:
  - name: scores
    path: "output/{prefix}_scores.csv"
    format: EDAM:format_3752
    description: "The ulm score matrix: pathway, then one column per sample."
  - name: results
    path: "output/{prefix}_results.csv"
    format: EDAM:format_3752
    description: "One row per scored gene set: pathway, log_fold_change_score (the mean score difference, test minus reference), t, pvalue, padj, size."
  - name: summary
    path: "output/{prefix}_summary.json"
    format: EDAM:format_3464
    description: "The contrast, the test, the counts of scored and significant sets, the thresholds, the package versions."
  - name: score_heatmap
    path: "figures/{prefix}_score_heatmap.png"
    description: "Heatmap of the ulm scores of the top sets by adjusted p-value, samples in columns, annotated by condition (and PDF)."
  - name: score_difference
    path: "figures/{prefix}_score_difference.png"
    description: "Bar plot of the score difference of the top sets, colored by significance (and PDF)."
  - name: session
    path: "output/session_info.txt"
    description: "The Python version and the package versions for the record."
environment:
  - name: decoupler
    version: "2.2.0"
    track: python
  - name: anndata
    version: "0.13.3.post0"
    track: python
  - name: pandas
    version: "3.0.5"
    track: python
  - name: numpy
    version: "2.5.2"
    track: python
  - name: scipy
    version: "1.16.3"
    track: python
  - name: statsmodels
    version: "0.15.0"
    track: python
  - name: matplotlib
    version: "3.11.1"
    track: python
  - name: seaborn
    version: "0.13.2"
    track: python
bioconductor: "3.23"
body_file: body.py
tests:
  - name: two-group-n6-hallmark
    dataset: two_group_n6/seed-1
    slots:
      counts_path: /work/data/counts.csv
      metadata_path: /work/data/metadata.csv
      condition_column: condition
      reference_level: control
      test_level: treated
      gmt_path: /work/refs/hallmark.gmt
    expect:
      - "exists output/gsva_scores.csv"
      - "exists output/gsva_results.csv"
      - "exists output/gsva_summary.json"
      - "exists output/session_info.txt"
      - "exists figures/gsva_score_heatmap.png"
      - "exists figures/gsva_score_heatmap.pdf"
      - "exists figures/gsva_score_difference.png"
      - "exists figures/gsva_score_difference.pdf"
      - "csv_rows output/gsva_results.csv >= 40"
      - "json output/gsva_summary.json n_samples == 12"
      - "truth_set_recall output/gsva_results.csv >= 0.66"
