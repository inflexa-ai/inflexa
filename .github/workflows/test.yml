name: Test

# Runs the unit suites of the independent subsystems. `cli/`, `harness/`, and
# `prov-kernel/` are self-contained bun packages (each owns its bun.lock), so
# each is installed and tested in its own job. All three suites use bun:test;
# `harness/` additionally runs pytest over its Python package asset.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: test (cli)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Every job installs the Bun that .bun-version names, so CI and developer
      # machines cannot drift apart unnoticed and a bump is one reviewable edit
      # rather than seven. The path resolves against the repo root
      # (GITHUB_WORKSPACE) — `uses:` steps ignore the job's working-directory.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # cli pins @inflexa-ai/harness to an exact published version and installs
      # it from npm (not file:../harness), so a plain install resolves it — no
      # in-repo harness build.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # A PR can change cli and harness together, and its checks must run
      # against that pair. The npm pin cannot see an unpublished harness. Thus
      # this step links the working-copy harness over the installed one, the
      # same as `bun run harness:local` on a developer machine. The harness
      # install comes first, because the link script builds the harness. A push
      # to main keeps the npm pin: release.yml waits on the push checks as its
      # release gate, and they must run against the harness version that the
      # shipped binary bundles.
      - name: Use the local harness
        if: github.event_name == 'pull_request'
        run: |
          bun install --frozen-lockfile --cwd ../harness
          bun run harness:local

      - name: Run tests
        run: bun test

  harness:
    name: test (harness)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness

    # Shared pgvector Postgres for the DB/DBOS suites. The test setup picks it
    # up via `CORTEX_TEST_PG_URL` (src/__tests__/setup/postgres.ts) and skips
    # testcontainers entirely — one server serves every test file, and DBOS
    # reuses the same database (its tables live in a `dbos` schema). This is
    # what lets the harness job run the full suite instead of a grep-selected
    # subset.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex
          POSTGRES_DB: cortex
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cortex -d cortex"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=20

    env:
      # Point `withSchema`/`withDbos` at the service container above.
      CORTEX_TEST_PG_URL: postgres://cortex:cortex@localhost:5432/cortex

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Every job installs the Bun that .bun-version names, so CI and developer
      # machines cannot drift apart unnoticed and a bump is one reviewable edit
      # rather than seven. The path resolves against the repo root
      # (GITHUB_WORKSPACE) — `uses:` steps ignore the job's working-directory.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      # The input-scan container decoder is Python shipped as a package asset, and
      # bun:test cannot reach it. Pinned into a venv put on PATH, so `test:python`
      # resolves the same pytest here as on a developer machine.
      - name: Set up Python tooling
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --disable-pip-version-check pytest==8.4.1
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run Python tests
        run: bun run test:python

  prov-kernel:
    name: test (prov-kernel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prov-kernel
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Every job installs the Bun that .bun-version names, so CI and developer
      # machines cannot drift apart unnoticed and a bump is one reviewable edit
      # rather than seven. The path resolves against the repo root
      # (GITHUB_WORKSPACE) — `uses:` steps ignore the job's working-directory.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test
