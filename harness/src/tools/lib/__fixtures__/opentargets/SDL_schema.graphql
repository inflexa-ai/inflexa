  "Semantically similar diseases based on a PubMed word embedding model"
  similarEntities(
    "List of IDs (EFO disease IDs, Ensembl gene IDs, or ChEMBL molecule IDs)"
    additionalIds: [String!],

    "List of entity names to search for (target, disease, drug,...)"
    entityNames: [String!],

    "Threshold similarity between 0 and 1"
    threshold: Float,

    "Number of items per page [Default: 25, Max: 3000]"
    size: Int): [Similarity!]!

  "Publications that mention this disease, alone or alongside other entities"
  literatureOcurrences(
    "List of IDs (EFO disease IDs, Ensembl gene IDs, or ChEMBL molecule IDs)"
    additionalIds: [String!],

    "Year at the lower end of the filter"
    startYear: Int,

    "Month at the lower end of the filter. This value will be ignored if startYear is not set"
    startMonth: Int,

    "Year at the higher end of the filter"
    endYear: Int,

    "Month at the higher end of the filter. This value will be ignored if endYear is not set"
    endMonth: Int,

    "Opaque cursor for pagination"
    cursor: String): Publications!

  "Human Phenotype Ontology (HPO) annotations linked to this disease as clinical signs or symptoms"
