name: "Release: prov-kernel"

# Releases @inflexa-ai/prov-kernel on its own, with no pull request. Pick a
# bump, and release-bump.yml pushes the bump to main as the release bot and
# blocks until release-prov-kernel.yml has the version on npm.
on:
  workflow_dispatch:
    inputs:
      prov_kernel_bump:
        description: "prov-kernel bump, from the version field of prov-kernel/package.json on main. None does nothing."
        required: false
        default: none
        type: choice
        options: [none, patch, minor, major]

permissions: {}

# One release at a time across all four dispatchable workflows. Two runs pushing
# bumps to main at once would cancel each other's checks on main, and the
# release gates that wait on those checks would then fail.
concurrency:
  group: release-bump
  cancel-in-progress: false

jobs:
  prov-kernel:
    uses: ./.github/workflows/release-bump.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit
    with:
      component: prov-kernel
      bump: ${{ inputs.prov_kernel_bump }}
