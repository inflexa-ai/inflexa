id: R-0140
title: "Fewer than 15 samples: a correlation network of the samples is noise, thus state it and use a prior network or stop"
assertion: >-
  If the cohort holds at most two groups of at most 7 samples, the total is
  below 15 samples, and a correlation across so few samples is unstable. Do
  not build a co-expression network from the expression alone on such a
  cohort, because the modules would reflect the noise of the correlations
  and not a shared regulation. State the sample count and the reason in the
  plan. Then either take a prior network, for example the STRING
  protein-protein associations of the reference store, as the structure and
  place the genes of interest on it, or stop and ask for a cohort of at
  least 15 to 20 samples.
modality: bulk_rna_seq
conditions:
  - field: n_groups
    op: lte
    value: 2
  - field: n_per_group_max
    op: lte
    value: 7
action:
  step_type: coexpression
  outcome: too_few_samples_prior_network_or_stop
  forbids: [M-0047]
severity: flag
strength: common_practice
evidence_quality: low
recommendation_strength: conditional
evidence:
  - direction: neutral
    eco: ECO:0000033
    cito: cito:discusses
    source: S-0107
    paraphrase: >-
      The network of the package rests on the pairwise correlations of the
      genes across the samples, thus the adjacency and every module derived
      from it are as reliable as the correlations that the sample set
      supports. The paper describes the package and its tutorials, and the
      sample floor of this rule comes from the package documentation and not
      from the paper.
    anchor: "Abstract; Background; Implementation, Network construction"
    retrieved: "2026-09-06"
