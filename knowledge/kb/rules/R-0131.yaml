id: R-0131
title: "CIBERSORT is the tool of record for LM22 proportions and is absent here: quanTIseq or EPIC give the proportions"
assertion: >-
  CIBERSORT is the tool of record for the relative proportions of the 22
  immune cell types of the LM22 signature matrix, by support vector
  regression, and it has an absolute mode. CIBERSORTx extends it with a
  correction for platform variation and with the inference of
  cell-type-specific expression. Both are distributed through their web
  portal under a license and not as an open package, thus both are absent
  from this pool.
  For an immune proportion, use quanTIseq or EPIC, which return absolute
  fractions from an open package, and state in the report that the cell
  types differ from the 22 types of LM22. Do not present a substitute result
  as an LM22 result.
modality: bulk_rna_seq
conditions:
  - field: organism
    op: eq
    value: human
action:
  step_type: deconvolution
  parameters:
    - name: lm22_tool_of_record
      value: cibersort_absent
      default_source: "doi:10.1038/nmeth.3337"
    - name: proportion_substitute
      value: quantiseq_or_epic_with_type_set_stated
      default_source: "doi:10.1093/bioinformatics/btz363"
