id: M-0033
label: "goseq over-representation with a gene length probability weighting function"
edam_operation: EDAM:operation_3501
description: >-
  Over-representation of a discrete gene list that corrects the selection bias
  of a count-based test. goseq fits a probability weighting function of the
  chance that a gene is called differentially expressed against its length,
  then it weights the null distribution of each category with that function.
  The gene length comes from the effective length of the quantifier or from
  the annotation.
packages:
  - name: goseq
    track: bioconductor
    biotools: goseq
    version_range: ">=1.50"
    bioconductor: "3.23"
  - name: GO.db
    track: bioconductor
    version_range: ">=3.20"
    bioconductor: "3.23"
  - name: org.Hs.eg.db
    track: bioconductor
    version_range: ">=3.20"
    bioconductor: "3.23"
  - name: org.Mm.eg.db
    track: bioconductor
    version_range: ">=3.20"
    bioconductor: "3.23"
templates:
  - tpl-goseq-hallmark
