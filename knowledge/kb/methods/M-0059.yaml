id: M-0059
label: "decoupler ulm per-sample pathway scores with a two-sample t-test on the scores"
edam_operation: EDAM:operation_3501
description: >-
  A per-sample score of each gene set from the decoupler univariate linear
  model (ulm): the t-value of the slope of the log-CPM values of a sample on
  the set membership. A two-sample t-test with a pooled variance then compares
  the scores of the test level against the reference level per set, and
  Benjamini-Hochberg adjusts the p-values. The t-test has no design, thus a
  pair, a block, a batch, or a covariate of the sample table does not enter
  the test. The Python substitute for M-0034 (GSVA with limma on the scores)
  when the design has no such requirement.
packages:
  - name: decoupler
    track: python
    version_range: ">=2.0"
  - name: scipy
    track: python
    version_range: ">=1.10"
  - name: statsmodels
    track: python
    version_range: ">=0.14"
templates:
  - tpl-decoupler-scores
