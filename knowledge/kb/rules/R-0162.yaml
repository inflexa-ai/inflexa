      value: expected_power_from_replicates_depth_and_dispersion
      default_source: "doi:10.1089/cmb.2012.0283"
    - name: power_tools_of_record
      value: RNASeqPower_and_PROPER_absent_closed_form_instead
      default_source: "rule:R-0162"
severity: warn
strength: common_practice
evidence_quality: moderate
recommendation_strength: conditional
evidence:
  - direction: supports
    eco: ECO:0000033
    cito: cito:supports
    source: S-0140
    paraphrase: >-
      The paper gives a closed form for the sample size of an RNA-seq
      comparison in terms of the sequencing depth, the biological
      coefficient of variation, the fold change, the significance level, and
      the power, and it estimates the biological and the technical variation
      from a large set of public RNA-seq experiments. The paper gives R code
      and a worksheet for the calculation.
    anchor: "Abstract; Methods, Sample size formula; Results"
    retrieved: "2026-09-06"
  - direction: supports
    eco: ECO:0000033
    cito: cito:supports
    source: S-0077
    paraphrase: >-
      The paper evaluates the power of a differential expression test by
      simulation from six public datasets as a function of the sample size
      and the depth, finds that a larger sample size raises the power more
      than a deeper sequencing does, and gives a power calculator tool. It
      does not give the PROPER package.
    anchor: "Abstract; Results"
    retrieved: "2026-09-06"
