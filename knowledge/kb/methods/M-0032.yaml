id: M-0032
label: "GO over-representation with clusterProfiler enrichGO and rrvgo term reduction"
edam_operation: EDAM:operation_3501
description: >-
  Hypergeometric over-representation of a discrete gene list against the Gene
  Ontology terms of one named ontology, with the tested genes as the universe
  and an organism annotation package for the gene-to-term map. The significant
  terms are reduced to representative terms by semantic similarity with rrvgo,
  thus a long list of nested terms becomes a short list of distinct findings.
packages:
  - name: clusterProfiler
    track: bioconductor
    biotools: clusterprofiler
    version_range: ">=4.10"
    bioconductor: "3.23"
  - name: rrvgo
    track: bioconductor
    version_range: ">=1.16"
    bioconductor: "3.23"
  - name: GO.db
    track: bioconductor
    version_range: ">=3.20"
    bioconductor: "3.23"
  - name: org.Hs.eg.db
    track: bioconductor
    version_range: ">=3.20"
    bioconductor: "3.23"
  - name: org.Mm.eg.db
    track: bioconductor
    version_range: ">=3.20"
    bioconductor: "3.23"
templates:
  - tpl-ora-go
