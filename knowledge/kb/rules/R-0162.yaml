id: R-0162
title: "Two or three replicates: the design step states the expected power from the replicate count, the depth, and the dispersion, because the power tools are absent here"
assertion: >-
  With two or three replicates per group, the design step states the
  expected power of the test before the model. The tools of record for a
  power and sample size calculation, RNASeqPower and PROPER, are not in the
  pool here. Compute the power from the closed form of the sample size in
  terms of the depth, the biological coefficient of variation, the fold
  change, and the significance level, or take the dispersion from a pilot
  or a public dataset of the same tissue, and state the fold change that
  the design can find with 80 percent power. State that a larger replicate
  count raises the power more than a deeper sequencing does. The statement
  is a caution on the plan and not a reason to loosen the threshold.
modality: bulk_rna_seq
conditions:
  - field: data_state
    op: eq
    value: counts
  - field: n_per_group_min
    op: gte
    value: 2
  - field: n_per_group_min
    op: lte
    value: 3
action:
  step_type: model_design
  parameters:
